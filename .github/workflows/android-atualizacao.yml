name: Android · teste de atualização (emulador)

# N05 (auditoria de 17/11, autorizado pelo Adauto): instala a versão publicada, põe os dados do backup de referência,
# instala por cima a versão deste commit e confere que nada foi perdido. Só teste: não cria release nem mexe em ponteiro.
on:
  workflow_dispatch:
    inputs:
      anterior:
        description: 'Release da versão anterior (padrão: a publicada agora, apk-latest)'
        default: 'apk-latest'

permissions:
  contents: read

jobs:
  atualizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Trava de publicação (compilar nunca publica)
        run: python3 .github/scripts/trava_publicacao.py

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Configurar Gradle (cache de dependências)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar a versão nova (site, mesma chave fixa do app publicado)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleSiteDebug
          cp app/build/outputs/apk/site/debug/*.apk novo.apk

      - name: Baixar a versão anterior publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.anterior }}" -p ArqueMeasure-debug.apk -O anterior.apk

      - name: Ativar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Atualizar por cima no emulador e conferir os dados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/teste_atualizacao_android.sh anterior.apk novo.apk

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-atualizacao-android
          path: atualizacao
          if-no-files-found: ignore
