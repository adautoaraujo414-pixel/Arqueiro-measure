name: Android CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Instalar plataforma e build-tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configurar Gradle (cache de dependências)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Salvar log de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Testes automatizados (JVM)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build.log

      - name: Verificar código (lint)
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug 2>&1 | tee -a build.log

      - name: Verificar APK gerado
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 6

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ArqueMeasure-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK na Release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/*.apk ArqueMeasure-debug.apk
          gh release create "$TAG" ArqueMeasure-debug.apk --target "$GITHUB_SHA" --prerelease \
            --title "ARQUE MEASURE APK debug #${GITHUB_RUN_NUMBER}" \
            --notes "APK de teste (debug). Protocolo Bluetooth Bosch NÃO validado com trena real."

      - name: Gerar AAB assinado para o Google Play (se a chave estiver configurada)
        if: success() && github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Sem chave de upload configurada: AAB não gerado."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Publicar AAB (só quem tem acesso ao repositório baixa)
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ArqueMeasure-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Resumo dos erros
        if: failure()
        run: |
          M=$( (grep -E '^e: |What went wrong|error:|Execution failed|FAILED|AssertionError|Exception' -A2 build.log | head -120) | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Erros do build::$M"

      - name: Publicar relatórios de lint e testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
