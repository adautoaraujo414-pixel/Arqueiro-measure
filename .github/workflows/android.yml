name: Android CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths-ignore: [ 'ios/**', '.github/workflows/ios.yml', 'docs/**', 'windows/**', '.github/workflows/windows*.yml' ]
  pull_request:
  # TESTAR (push / disparo no modo "teste"): compila, testa e gera o APK de TESTE. Nunca mexe na versão dos usuários.
  # PUBLICAR: só à mão, modo "publicar" e escrevendo a confirmação "PUBLICAR <7 letras do commit>".
  workflow_dispatch:
    inputs:
      modo:
        description: 'teste = APK de teste (instala ao lado, não atualiza ninguém) · publicar = atualiza a versão dos usuários'
        type: choice
        options: [ teste, publicar ]
        default: teste
      confirmar:
        description: 'Só pra publicar: escreva PUBLICAR e as 7 primeiras letras do commit (ex.: PUBLICAR a54f405)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico e tags: as novidades saem dos commits desde o apk-N anterior

      - name: Trava de publicação (compilar nunca publica)
        run: python3 .github/scripts/trava_publicacao.py

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Instalar plataforma e build-tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configurar Gradle (cache de dependências)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug (site) e conferir a versão Google Play
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleSiteDebug compilePlayReleaseKotlin 2>&1 | tee build.log

      - name: APK de TESTE (outro pacote, instala ao lado do app de verdade, sem atualizador)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.modo == 'teste'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          cp app/build/outputs/apk/site/debug/*.apk "$RUNNER_TEMP/publico.apk"
          ./gradlew --no-daemon assembleSiteDebug -Pteste=1 2>&1 | tee -a build.log
          cp app/build/outputs/apk/site/debug/*.apk Arquemestre-TESTE.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging Arquemestre-TESTE.apk | head -n 3
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging Arquemestre-TESTE.apk | grep -q "name='br.com.arque.measure.teste'" || { echo "::error::o APK de teste saiu com o pacote do app de verdade"; exit 1; }
          TAG="teste-android-${GITHUB_RUN_NUMBER}"
          printf 'APK de TESTE do commit %s.\nInstala AO LADO do Arquemestre (nome "Arquemestre TESTE"), com dados separados. Não atualiza nem substitui o app dos usuários.\n' "${GITHUB_SHA::7}" > nota-teste.txt
          gh release create "teste-android-${GITHUB_RUN_NUMBER}" Arquemestre-TESTE.apk --target "$GITHUB_SHA" --prerelease --title "TESTE Android ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}) · não é versão pública" --notes-file nota-teste.txt
          echo "::notice title=APK de teste::https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Arquemestre-TESTE.apk"
          # volta o APK normal pro lugar (os passos seguintes conferem ele)
          ./gradlew --no-daemon assembleSiteDebug 2>&1 | tail -n 3

      - name: Salvar log de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Testes automatizados (JVM)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testSiteDebugUnitTest 2>&1 | tee -a build.log

      - name: Verificar código (lint)
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintSiteDebug 2>&1 | tee -a build.log

      - name: Verificar APK gerado
        run: |
          APK=$(ls app/build/outputs/apk/site/debug/*.apk | head -n1)
          echo "APK: $APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 6

      - name: Guardar o APK desta compilação (artefato, não é publicação)
        uses: actions/upload-artifact@v4
        with:
          name: ArqueMeasure-debug-apk
          path: app/build/outputs/apk/site/debug/*.apk
          if-no-files-found: error

      - name: PUBLICAR pros usuários (release apk-N e ponteiro apk-latest)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.modo == 'publicar'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          python3 .github/scripts/trava_publicacao.py confirmar "$CONFIRMAR"
          # guarda o ponteiro anterior (pra poder voltar): fica anotado na release desta versão
          ANT=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/latest.txt" || echo "?")
          echo "::notice title=Publicação::versão pública anterior apk-${ANT} · nova apk-${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          TAG="apk-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/site/debug/*.apk ArqueMeasure-debug.apk
          # novidades desta versão (o app mostra no aviso de atualização): commits desde o apk-N anterior
          python3 .github/scripts/novidades.py apk- "$TAG" > novidades.txt || echo "Novidades desta versão:\nMelhorias e correções." > novidades.txt
          cat novidades.txt
          # reexecução: a release já existe -> mantém tudo como está (não apaga nem sobrescreve)
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "ArqueMeasure-debug.apk"; then
              echo "::notice title=Release::$TAG já tem o APK (reexecução): mantido sem alteração."
            else
              gh release upload "$TAG" ArqueMeasure-debug.apk
            fi
          else
            gh release create "$TAG" ArqueMeasure-debug.apk novidades.txt --target "$GITHUB_SHA" --prerelease \
              --title "ARQUE MEASURE APK debug #${GITHUB_RUN_NUMBER}" \
              --notes-file novidades.txt
          fi
          # ponteiro fixo "apk-latest": o app lê latest.txt direto do download (sem feed, sem limite da API)
          echo "${GITHUB_RUN_NUMBER}" > latest.txt
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Android · última versão (ponteiro)" --notes "Usado pelo app pra se atualizar sozinho. A versão de verdade está em apk-N."
          gh release upload apk-latest latest.txt ArqueMeasure-debug.apk novidades.txt --clobber

      - name: Gerar AAB assinado para o Google Play (só no modo publicar)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.modo == 'publicar'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          python3 .github/scripts/trava_publicacao.py confirmar "$CONFIRMAR"
          set -o pipefail
          if [ -z "$KEY_PASS" ]; then
            # confere que a versão da loja compila inteira, mesmo sem a chave (AAB sem assinatura não é publicado)
            ./gradlew --no-daemon bundlePlayRelease 2>&1 | tee -a build.log
            echo "::warning title=Google Play::Falta o segredo UPLOAD_KEY_PASSWORD: AAB compilado mas NÃO assinado nem publicado."; exit 0
          fi
          # a chave de upload fica no repositório criptografada; só abre com a senha do segredo
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/upload-key.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:KEY_PASS || { echo "::warning title=Google Play::A senha UPLOAD_KEY_PASSWORD não abre a chave: AAB não gerado."; exit 0; }
          set -o pipefail
          ./gradlew --no-daemon bundlePlayRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEY_PASS" \
            -Pandroid.injected.signing.key.alias=arquemestre \
            -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tee -a build.log
          rm -f "$RUNNER_TEMP/upload.jks"
          AAB=$(ls app/build/outputs/bundle/playRelease/*.aab | head -n1)
          cp "$AAB" Arquemestre-GooglePlay.aab
          # confere a assinatura (só dados públicos do certificado aparecem no log)
          jarsigner -verify Arquemestre-GooglePlay.aab | tail -n 2
          jarsigner -verify Arquemestre-GooglePlay.aab | grep -q "jar verified" || { echo "::error::AAB sem assinatura válida"; exit 1; }
          FP=$(keytool -printcert -jarfile Arquemestre-GooglePlay.aab | grep -E "SHA256:" | head -n1 | sed 's/.*SHA256: //')
          OWNER=$(keytool -printcert -jarfile Arquemestre-GooglePlay.aab | grep -m1 "Owner:" | sed 's/.*Owner: //')
          SUM=$(sha256sum Arquemestre-GooglePlay.aab | cut -d' ' -f1)
          echo "Certificado: $OWNER"; echo "SHA-256 do certificado: $FP"; echo "SHA-256 do arquivo: $SUM"
          echo "::notice title=AAB assinado::Certificado $OWNER · SHA-256 $FP"
          TAG="apk-${GITHUB_RUN_NUMBER}"
          NOTE="AAB assinado com a chave de upload (certificado SHA-256 $FP). Arquivo SHA-256 $SUM."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Arquemestre Google Play #${GITHUB_RUN_NUMBER}" --notes "$NOTE"
          NAME=Arquemestre-GooglePlay.aab
          # reexecução: não sobrescreve o AAB que já está publicado; o novo sai com o número da tentativa
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$NAME"; then
            NAME="Arquemestre-GooglePlay-tentativa-${GITHUB_RUN_ATTEMPT}.aab"
            cp Arquemestre-GooglePlay.aab "$NAME"
          fi
          gh release upload "$TAG" "$NAME"
          echo "::notice title=Google Play::$NAME publicado em $TAG"

      - name: Resumo dos erros
        if: failure()
        run: |
          M=$( (grep -E '^e: |What went wrong|error:|Execution failed|FAILED|AssertionError|Exception' -A2 build.log | head -120) | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Erros do build::$M"

      - name: Publicar relatórios de lint e testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/lint-results-siteDebug.html
            app/build/reports/tests/testSiteDebugUnitTest/
          if-no-files-found: ignore
