name: Android CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma e build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle (cache de dependências)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Testes automatizados (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Verificar código (lint)
        run: ./gradlew --no-daemon lintDebug

      - name: Verificar APK gerado
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 6

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ArqueMeasure-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar relatórios de lint e testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
