name: App Store - enviar capturas de tela

# Pega as capturas do último iOS CI (ramo ci/ios-resultados) e sobe na versão em preparo do App Store Connect.
# Roda em Linux (sem fila de Mac) e também serve pra testar se a chave da API (segredos ASC_*) está certa.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Troca as capturas da versão em preparo na Apple. Pra rodar, escreva exatamente: TROCAR CAPTURAS'
        type: string
        default: ''

jobs:
  # TRAVA (22/11): job separado; os outros jobs dependem dele (needs), então com a trava falhando nenhum passo deles roda, nem os always()
  trava:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trava
        if: inputs.confirmar != 'TROCAR CAPTURAS'
        run: |
          echo "::error title=TRAVA::Pra trocar as capturas na Apple, dispare à mão e escreva exatamente: TROCAR CAPTURAS"
          exit 1
      - name: Liberado
        run: echo "Trava ok, pode seguir."
  capturas:
    needs: trava
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Baixar as capturas
        run: git fetch --depth 1 origin ci/ios-resultados && git worktree add /tmp/res FETCH_HEAD && ls /tmp/res/capturas
      - run: pip install pyjwt cryptography requests pillow
      - name: Enviar ao App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python .github/scripts/asc_screenshots.py /tmp/res/capturas 6829800820
