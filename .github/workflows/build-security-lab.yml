name: Android Security Lab - APK

on:
  push:
    branches:
      - lab-seguranca-android
    paths:
      - 'security-lab/**'
      - '.github/workflows/build-security-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar plataforma Android 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK de diagnóstico
        working-directory: security-lab
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: arque-security-lab-apk
          path: security-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
