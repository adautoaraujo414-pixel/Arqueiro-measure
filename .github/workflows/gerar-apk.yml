name: Gerar APK Arque Measure
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extrair pacote do projeto
        run: |
          if [ -f "Arque_Measure_v0.8_GitHub_Actions_Pronto.zip" ]; then
            unzip -o "Arque_Measure_v0.8_GitHub_Actions_Pronto.zip" -d .
          fi
          test -f settings.gradle || (echo "ERRO: envie o ZIP Arque_Measure_v0.8_GitHub_Actions_Pronto.zip para a raiz do repositório" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Arque-Measure-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
