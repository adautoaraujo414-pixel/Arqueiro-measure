name: Gerar APK Arque Measure
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e extrair fontes
        run: |
          set -euxo pipefail
          ls -lah
          test -f Arque_Measure_v0.8_GitHub_Actions_Pronto.zip
          if [ ! -f settings.gradle ]; then unzip -o Arque_Measure_v0.8_GitHub_Actions_Pronto.zip -d .; fi
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Versionar fontes do aplicativo
        run: |
          if ! git ls-files --error-unmatch settings.gradle >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add settings.gradle app build.gradle gradle.properties gradlew gradlew.bat gradle 2>/dev/null || git add settings.gradle app
            git commit -m "Versionar fontes do Arque Measure para evolucao do aplicativo"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar Arque Link criptografado entre duas instancias
        run: |
          mkdir -p /tmp/arque-link-test
          javac -d /tmp/arque-link-test app/src/main/java/com/arque/measure/ArqueLink.java tests/ArqueLinkSmoke.java
          java -cp /tmp/arque-link-test com.arque.measure.ArqueLinkSmoke
      - name: Testar plano de corte
        run: node tests/cut.test.cjs
      - name: Testar Laboratorio 2D e origem das medidas
        run: node tests/lab.test.cjs
      - name: Testar engenharia de módulos paramétricos
        run: node tests/modules.test.cjs
      - name: Testar montagem por vão e peças especiais
        run: node tests/assembly.test.cjs
      - name: Testar ambiente visual espacial em milímetros
        run: node tests/visual.test.cjs
      - name: Testar catálogo de cozinha e eletrodomésticos
        run: node tests/kitchen.test.cjs
      - name: Testar alinhamento de móveis e linhas do esboço
        run: node tests/align.test.cjs
      - name: 'Testar oficina avançada: L, ímã, cava, paredes e produção'
        run: node tests/advanced.test.cjs
      - name: Testar cotas e seleção direta de peças 3D
        run: node tests/precision.test.cjs
      - name: Testar ferragens e guia de canto de 45 graus
        run: node tests/fabrication.test.cjs
      - name: Auditoria dos quatro blocos do aplicativo
        run: node tests/audit.test.cjs
      - name: Testar interface e persistencia em navegador simulado
        run: |
          npm install --prefix /tmp/arque-ui-test --no-audit --no-fund jsdom@26 fake-indexeddb@6
          set -o pipefail
          NODE_PATH=/tmp/arque-ui-test/node_modules node tests/ui.test.cjs 2>&1 | tee ui-test.log
      - name: Testar laboratório inicial, toque e correção do esboço
        run: NODE_PATH=/tmp/arque-ui-test/node_modules node tests/alignment-ui.test.cjs
      - name: Testar seis ferramentas integradas do Laboratório
        run: NODE_PATH=/tmp/arque-ui-test/node_modules node tests/advanced-ui.test.cjs
      - name: Testar cotas e ajuste fino no laboratório real
        run: NODE_PATH=/tmp/arque-ui-test/node_modules node tests/precision-ui.test.cjs
      - name: Testar ferragens e canto 45 no laboratório
        run: NODE_PATH=/tmp/arque-ui-test/node_modules node tests/fabrication-ui.test.cjs
      - name: Registrar falhas da interface
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s ui-test.log ]; then gh issue create --title "Falha da interface - $GITHUB_RUN_ID" --body-file ui-test.log || true; fi
      - name: Preparar assinatura privada opcional
        env:
          ARQUE_KEYSTORE_B64: ${{ secrets.ARQUE_KEYSTORE_BASE64 }}
          ARQUE_KEYSTORE_PASSWORD: ${{ secrets.ARQUE_KEYSTORE_PASSWORD }}
          ARQUE_KEY_ALIAS: ${{ secrets.ARQUE_KEY_ALIAS }}
          ARQUE_KEY_PASSWORD: ${{ secrets.ARQUE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ARQUE_KEYSTORE_B64" ]; then
            test -n "$ARQUE_KEYSTORE_PASSWORD" && test -n "$ARQUE_KEY_ALIAS" && test -n "$ARQUE_KEY_PASSWORD"
            printf '%s' "$ARQUE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/arque-release.jks"
            chmod 600 "$RUNNER_TEMP/arque-release.jks"
            echo "ARQUE_KEYSTORE_PATH=$RUNNER_TEMP/arque-release.jks" >> "$GITHUB_ENV"
            echo "ARQUE_KEYSTORE_PASSWORD=$ARQUE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ARQUE_KEY_ALIAS=$ARQUE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ARQUE_KEY_PASSWORD=$ARQUE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ARQUE_BUILD_TASK=assembleRelease" >> "$GITHUB_ENV"
          else
            echo "ARQUE_BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "Assinatura release ainda nao configurada; usando APK debug."
          fi
      - name: Compilar e salvar log
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace "$ARQUE_BUILD_TASK" 2>&1 | tee arque-build.log
      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arque-Measure-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Relatorio de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Arque-Measure-Erros
          path: arque-build.log
          if-no-files-found: ignore
      - name: Criar issue com erro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Falha na compilacao GitHub Actions: $GITHUB_RUN_ID" > /tmp/erro.md
          echo '\x60\x60\x60' >> /tmp/erro.md
          if [ -f arque-build.log ]; then tail -c 15000 arque-build.log >> /tmp/erro.md; else echo "Falha anterior ao Gradle; conferir etapa de extracao ou instalacao do SDK." >> /tmp/erro.md; fi
          echo '\x60\x60\x60' >> /tmp/erro.md
          gh issue create --title "Falha APK - run $GITHUB_RUN_ID" --body-file /tmp/erro.md || true
