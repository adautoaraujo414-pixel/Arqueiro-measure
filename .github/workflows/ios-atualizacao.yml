name: iOS · teste de atualização (simulador)
# Compila a versão publicada e a nova para o SIMULADOR e testa a instalação por cima com os dados do backup de referência.
# Não assina, não envia ao TestFlight, não publica.
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ '.github/workflows/ios-atualizacao.yml', '.github/scripts/teste_atualizacao_ios.sh', 'ios/ArquemestreTests/AtualizacaoAbreProjetosTests.swift' ]
  workflow_dispatch:
    inputs:
      anterior:
        description: 'Commit da versão publicada (App Store 3.0.13 = 3f1c3a58, liberada; confirmado pelo Adauto 24/11)'
        default: '3f1c3a58bf7c87bf1d595d867c44a1bf4a0e9ec0'
permissions:
  contents: read
jobs:
  atualizacao:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Baixar a versão nova
        uses: actions/checkout@v4
        with: { path: novo }
      - name: Trava de publicação (compilar nunca publica)
        run: cd novo && python3 .github/scripts/trava_publicacao.py
      - name: Baixar a versão publicada
        uses: actions/checkout@v4
        with: { path: anterior, ref: "${{ inputs.anterior || '3f1c3a58bf7c87bf1d595d867c44a1bf4a0e9ec0' }}" }
      - name: Compilar as duas para o simulador
        run: |
          brew install xcodegen
          (cd anterior/ios && xcodegen generate && xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Debug -sdk iphonesimulator -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -40 build.log; exit 1; })
          # a nova também com os testes (21/11): depois da atualização, o teste AtualizacaoAbreProjetosTests abre os projetos no editor
          (cd novo/ios && xcodegen generate && xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Debug -sdk iphonesimulator -derivedDataPath build/dd CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= build-for-testing > build.log 2>&1 || { tail -40 build.log; exit 1; })
      - name: Atualizar por cima no simulador e conferir os dados
        run: bash novo/.github/scripts/teste_atualizacao_ios.sh "anterior/ios/build/dd/Build/Products/Debug-iphonesimulator/Arquemestre.app" "novo/ios/build/dd/Build/Products/Debug-iphonesimulator/Arquemestre.app"
      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: teste-atualizacao-ios, path: atualizacao, if-no-files-found: ignore }
