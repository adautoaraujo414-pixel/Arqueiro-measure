name: iOS CI

on:
  push:
    branches: [ 'feature/**' ]
    paths: [ 'ios/**', 'app/src/main/assets/editor.html', '.github/workflows/ios.yml' ]
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Enviar para o TestFlight (precisa da conta Apple paga e dos segredos ASC_*)'
        type: boolean
        default: false
      testado_em:
        description: 'Só com testflight: SHA (40 letras) de uma execução do iOS CI que já passou inteira. Os testes não rodam de novo; o envio confere que o código é o mesmo (só este arquivo pode mudar)'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 210
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Xcode 26 (exigido pela App Store desde 28/04/2026)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$X" ] || X=/Applications/Xcode.app
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Conferência App Store (o que mais dá recusa na revisão)
        run: |
          set -o pipefail
          mkdir -p ios/build
          python3 ios/scripts/appstore_check.py | tee ios/build/appstore-check.txt

      - name: Gerar o projeto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # SO-ENVIAR (Adauto 26/11: "não refaça testes que já foram feitos"): com testado_em, o envio usa os testes de uma execução que já
      # passou inteira (iPhone A+B, iPad, capturas, StoreKit) e confere que o código é o mesmo. Se não conferir, nada é enviado.
      - name: Testes já feitos (testado_em)
        id: ja_testado
        if: inputs.testado_em
        env:
          T: ${{ inputs.testado_em }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [[ "$T" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::testado_em tem que ser o SHA inteiro (40 letras)"; exit 1; }
          [ "${{ inputs.testflight }}" = "true" ] || { echo "::error::testado_em só vale com testflight"; exit 1; }
          git fetch -q --depth=1 origin "$T"
          if ! git diff --quiet FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ios.yml'; then
            git diff --stat FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ios.yml'; echo "::error::o código não é o mesmo da execução testada"; exit 1; fi
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$T&status=success&per_page=5" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);r=d.get("workflow_runs",[]);[print("execução testada:",x["run_number"],x["html_url"]) for x in r];sys.exit(0 if r else 1)' \
            || { echo "::error::não achei execução do iOS CI que passou inteira no $T"; exit 1; }

      - name: Testar preservação dos vídeos do editor iOS
        if: ${{ !inputs.testado_em }}
        run: node ios/scripts/test-editor-media-backup.cjs

      # BATERIA-2-PASSOS (Chefe 25/11): a bateria inteira não cabe nos 75 min do passo e nenhum limite muda. O iPhone roda em 2 passos com os
      # mesmos 75 min e a mesma tolerância por teste: A (tudo menos a metade B do EditorWebKitTests) e B (a metade B, test-without-building).
      # scripts/metade_testes.py divide pela lista do código e prova a contagem (A + B = todos, sem repetir) antes e depois.
      - name: Compilar e rodar os testes no simulador (iPhone, passo A)
        if: ${{ !inputs.testado_em }}
        id: build_tests
        timeout-minutes: 75
        run: |
          cd ios && mkdir -p build
          python3 scripts/metade_testes.py contagem
          UDID=$(python3 scripts/pick_sim.py iphone)
          echo "$UDID" > build/udid-iphone.txt
          # 25/11 (Chefe/Adauto): aquece o simulador do iPhone antes da bateria, como o do iPad. A 1ª abertura do editor levou 47,6 s
          # no 690 e mais de 60 s no 694 (simulador ainda subindo); no 692, com o mesmo app, 10,4 s. Nenhum limite de teste muda.
          # Chefe 25/11 (pedido do Adauto: investigar testes instáveis): o iPhone também é ligado e aquecido antes
          # da bateria, igual ao iPad. Nenhum limite muda: a 1ª abertura do editor continua medida (ABERTURA-DIAG) e com 20 s.
          T0=$(date +%s); xcrun simctl boot "$UDID" 2>/dev/null; xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          echo "ABERTURA-DIAG simulador do iPhone ligado em $(( $(date +%s) - T0 )) s (antes da bateria)"
          # RECURSO-DIAG (Chefe 25/11, quedas do 699): amostra a cada 60 s os processos do WebKit e do app de teste (só leitura)
          bash scripts/amostra_processos.sh build/processos-iphone.log & AMOSTRA=$!
          set +e
          xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/Testes.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 \
            -skip-testing:ArquemestreTests/SubscriptionTests $(python3 scripts/metade_testes.py args A) -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            test > build/xcodebuild-test.log 2>&1
          RC=$?
          kill $AMOSTRA 2>/dev/null
          grep -E "error:|Test Case .*(passed|failed)|Executed|SKT:|\*\* " build/xcodebuild-test.log | grep -v -E "ProcessAssertion|makeImagePlus|WEBP"  | tail -n 300
          echo "==== FALHAS ===="; grep -E "error:|Test Case .*failed" build/xcodebuild-test.log | grep -v -E "ProcessAssertion|makeImagePlus|WEBP" | head -n 80
          # teste que derrubou o app de teste (não aparece como "failed"): mostra qual estava rodando e o que o xcodebuild disse
          echo "==== QUEDAS ===="; grep -n -E "Restarting after unexpected exit|crashed|unexpected exit|Test crashed|Testing failed|lost connection|was interrupted|Test Case .*started" build/xcodebuild-test.log | grep -B1 -E "Restarting|crash|unexpected|Testing failed|lost connection|interrupted" | grep -v -E "ProcessAssertion|makeImagePlus|WEBP" | head -n 60
          # medidas do Caderno (tempo de escrever/mover a folha) que os CadernoTests imprimem: saem aqui pra não se perderem no corte das últimas linhas
          echo "==== CADERNO (medidas) ===="; grep -hE "CADERNO-PERF|Test Case .*CadernoTests" build/xcodebuild-test.log | head -n 80
          exit $RC

      - name: Testes no simulador (iPhone, passo B)
        id: build_tests_b
        if: ${{ !inputs.testado_em && (always() && (steps.build_tests.outcome == 'success' || steps.build_tests.outcome == 'failure')) }}
        timeout-minutes: 75
        run: |
          cd ios && mkdir -p build
          # QUEDA-PARALELO (iOS 701, 25/11): quando um passo acaba por tempo, o xcodebuild dele NÃO morre e continua rodando junto com o
          # seguinte (dois apps de teste, WebContent de até 1 GB): o Mac troca memória com o disco, para 1 a 2 min, o teste do momento passa
          # de 120 s e o Xcode reinicia o app de teste. Antes do passo B, encerra o que sobrou do A. Nenhum limite muda.
          SOBRA=$(pgrep -f "xcodebuild.*build/Testes.xcresult" | wc -l | tr -d ' ')
          echo "ABERTURA-DIAG xcodebuild do passo A ainda rodando antes do B: $SOBRA"
          if [ "$SOBRA" != "0" ]; then echo "::warning title=iPhone::o passo A acabou por tempo e o xcodebuild dele continuava rodando; encerrado antes do B"; fi
          pkill -f "xcodebuild.*build/Testes.xcresult" 2>/dev/null || true; pkill -f "amostra_processos.sh build/processos-iphone.log" 2>/dev/null || true; sleep 5
          UDID=$(cat build/udid-iphone.txt 2>/dev/null || python3 scripts/pick_sim.py iphone)
          # (bash -e: boot de simulador já ligado e pkill sem processo devolvem erro; aqui não é falha)
          xcrun simctl boot "$UDID" 2>/dev/null || true; xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 || true
          bash scripts/amostra_processos.sh build/processos-iphone-b.log & AMOSTRA=$!
          echo "######## passo B ########" >> build/xcodebuild-test.log
          set +e
          xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/TestesB.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 \
            $(python3 scripts/metade_testes.py args B) -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            test-without-building > build/xcodebuild-test-b.log 2>&1
          RC=$?
          kill $AMOSTRA 2>/dev/null
          cat build/xcodebuild-test-b.log >> build/xcodebuild-test.log
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " build/xcodebuild-test-b.log | grep -v -E "ProcessAssertion|makeImagePlus|WEBP"  | tail -n 300
          echo "==== FALHAS ===="; grep -E "error:|Test Case .*failed" build/xcodebuild-test-b.log | grep -v -E "ProcessAssertion|makeImagePlus|WEBP" | head -n 80
          # prova (Chefe 25/11): A + B rodaram todos os testes de antes
          python3 scripts/metade_testes.py contagem; python3 scripts/metade_testes.py confere build/xcodebuild-test.log | tee build/contagem-iphone.txt
          exit $RC

      # Adauto 21/11 ("não esconda falhas com repetição automática"): todo teste que falhou na 1ª tentativa e só passou
      # na repetição aparece aqui como aviso, com o tempo de abertura do editor medido por fase (ABERTURA-DIAG)
      - name: Testes que só passaram na repetição
        if: ${{ !inputs.testado_em && (always()) }}
        run: |
          cd ios && mkdir -p build
          : > build/repetidos.txt
          for L in build/xcodebuild-test.log build/xcodebuild-test-ipad.log; do [ -f "$L" ] || continue
            D=iPhone; case "$L" in *ipad*) D=iPad;; esac
            grep -oE "Test Case '-\[[^]]+\]' failed" "$L" | sed -E "s/Test Case '-\[(.*)\]' failed/\1/" | sort -u | while read T; do
              if grep -qF "Test Case '-[$T]' passed" "$L"; then echo "$D · só passou na repetição · $T"; else echo "$D · FALHOU nas duas · $T"; fi
            done >> build/repetidos.txt
            grep -hE "ABERTURA-DIAG" "$L" | sed "s/^/$D · /" | head -n 40 >> build/abertura.txt || true
          done
          echo "==== REPETIDOS ===="; cat build/repetidos.txt
          echo "==== ABERTURA DO EDITOR ===="; cat build/abertura.txt 2>/dev/null
          while read X; do echo "::warning title=Teste repetido::$X"; done < build/repetidos.txt

      - name: Compilar para iPhone de verdade (Release, sem assinatura)
        if: ${{ !inputs.testado_em }}
        run: |
          cd ios && mkdir -p build
          set +e
          xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ddrel \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build/xcodebuild-release.log 2>&1
          RC=$?
          grep -E "error:|\*\* " build/xcodebuild-release.log | tail -n 200
          exit $RC

      # Adauto 24/11: pacote de TESTE do iOS só como artefato do Actions (sem TestFlight, sem App Store, sem release).
      # Sem assinatura ele não instala em iPhone de verdade: o .app do simulador abre no Simulador do Xcode.
      - name: Pacote de TESTE iOS (só artefato do Actions, não é publicação)
        if: ${{ !inputs.testado_em }}
        run: |
          cd ios && mkdir -p build/pacote-teste
          ditto -c -k --keepParent build/ddrel/Build/Products/Release-iphoneos/Arquemestre.app build/pacote-teste/Arquemestre-TESTE-iphoneos-sem-assinatura.zip
          ditto -c -k --keepParent build/dd/Build/Products/Debug-iphonesimulator/Arquemestre.app build/pacote-teste/Arquemestre-TESTE-simulador.zip
          printf 'Pacote de TESTE iOS do commit %s. Não é versão pública: sem assinatura não instala em iPhone de verdade (o do simulador abre no Simulador do Xcode).\n' "${GITHUB_SHA::7}" > build/pacote-teste/nota.txt
          shasum -a 256 build/pacote-teste/*.zip | tee build/pacote-teste/sha256.txt

      - name: Guardar o pacote de TESTE iOS (artefato)
        if: ${{ !inputs.testado_em }}
        uses: actions/upload-artifact@v4
        with:
          name: Arquemestre-TESTE-ios
          path: ios/build/pacote-teste/
          if-no-files-found: error

      - name: Capturas de tela (iPhone 6,9" e iPad 13")
        if: ${{ !inputs.testado_em }}
        run: |
          cd ios
          APP=$(ls -d build/dd/Build/Products/Debug-iphonesimulator/Arquemestre.app)
          bash scripts/screenshots.sh "$APP" build/capturas

      - name: Capturas não podem sair vazias (tela que não carregou)
        if: ${{ !inputs.testado_em }}
        run: |
          set -o pipefail
          cd ios
          { cat build/capturas-tentativas.txt 2>/dev/null; python3 scripts/check_blank.py build/capturas; } | tee build/blank-check.txt

      # Assinatura (StoreKit Testing): no iOS 26.3+ o `xcodebuild test` não carrega o .storekit (bug da Apple FB22237318),
      # então estes testes rodam num simulador iOS até 26.2 (se não tiver no runner, baixa o iOS 26.1).
      - name: Testes da assinatura (StoreKit) num iOS até 26.2
        id: storekit
        if: ${{ !inputs.testado_em && (always() && steps.build_tests.outcome != 'skipped') }}
        timeout-minutes: 40
        run: |
          cd ios && mkdir -p build
          xcrun simctl list runtimes > build/runtimes.txt 2>&1 || true
          cat build/runtimes.txt
          UDID=$(python3 scripts/pick_sim.py storekit) || UDID=""
          if [ -z "$UDID" ]; then
            echo "SKT: sem simulador iOS <= 26.2 no runner; baixando o iOS 26.1"
            for v in 26.1 26.2 26.0; do
              xcodebuild -downloadPlatform iOS -buildVersion "$v" > build/download.log 2>&1 && { echo "SKT: baixou iOS $v"; break; }
              echo "SKT: não deu pra baixar iOS $v: $(tail -n 3 build/download.log | tr '\n' ' ')"
            done
            xcrun simctl list runtimes >> build/runtimes.txt 2>&1 || true
            RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable') and tuple(int(p) for p in x['version'].split('.')[:2])<=(26,2) and tuple(int(p) for p in x['version'].split('.')[:2])>=(17,0)];r.sort(key=lambda x:[int(p) for p in x['version'].split('.')]);print(r[-1]['identifier'] if r else '')")
            if [ -n "$RT" ]; then
              for dt in "iPhone 17 Pro" "iPhone 16 Pro" "iPhone 16" "iPhone 15"; do
                UDID=$(xcrun simctl create "iPhone StoreKit" "$dt" "$RT" 2>/dev/null) && break
              done
            fi
          fi
          if [ -z "$UDID" ]; then echo "SKT: nenhum simulador iOS <= 26.2 disponível"; exit 1; fi
          echo "SKT: simulador dos testes da assinatura: $(xcrun simctl list devices | grep "$UDID")"
          set +e
          xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/ddsk -resultBundlePath build/TestesAssinatura.xcresult \
            -only-testing:ArquemestreTests/SubscriptionTests -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            test > build/xcodebuild-storekit.log 2>&1
          RC=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|SKT:|\*\* " build/xcodebuild-storekit.log | grep -v -E "ProcessAssertion|makeImagePlus|WEBP"  | tail -n 300
          exit $RC

      - name: Guardar capturas e resumo dos testes no ramo ci/ios-resultados
        if: ${{ !inputs.testado_em && (always() && github.event_name != 'pull_request') }}
        run: |
          cd ios
          OUT=$(mktemp -d)
          mkdir -p "$OUT/capturas"
          cp -R build/capturas/. "$OUT/capturas/" 2>/dev/null || true
          # páginas do PDF do orçamento geradas pelos testes (pra conferir o desenho do iPhone de olho)
          mkdir -p "$OUT/orcamento"; cp -R build/orcamento/. "$OUT/orcamento/" 2>/dev/null || true
          { echo "commit $GITHUB_SHA · execução $GITHUB_RUN_NUMBER"; xcodebuild -version;
            grep -hE "Test Case .*(passed|failed)|Executed [0-9]+ test|error:|SKT:|SKInternal|StoreKit|storekit|\*\* " build/xcodebuild-test.log build/xcodebuild-release.log 2>/dev/null | tail -n 500;
            echo "==== Repetidos (falharam na 1ª tentativa) ===="; cat build/repetidos.txt 2>/dev/null;
            echo "==== Abertura do editor (ABERTURA-DIAG) ===="; cat build/abertura.txt 2>/dev/null;
            echo "==== Contagem do iPhone (passos A + B) ===="; cat build/contagem-iphone.txt 2>/dev/null;
            echo "==== Caderno (medidas, iPhone e iPad) ===="; grep -hE "CADERNO-PERF|Test Case .*CadernoTests" build/xcodebuild-test.log build/xcodebuild-test-ipad.log 2>/dev/null | head -n 160;
            echo "==== Assinatura (StoreKit) ===="; grep -hE "Test Case .*(passed|failed)|Executed [0-9]+ test|error:|SKT:|SKInternal|\*\* " build/xcodebuild-storekit.log 2>/dev/null | tail -n 300;
            echo "==== Conferência App Store ===="; cat build/appstore-check.txt 2>/dev/null;
            echo "==== Capturas vazias? ===="; cat build/blank-check.txt 2>/dev/null;
            echo "==== Simuladores ===="; cat build/runtimes.txt 2>/dev/null; } > "$OUT/RESUMO.txt" || true
          # Adauto 25/11: as falhas e evidências ficam guardadas mesmo quando o passo é interrompido (tempo estourado):
          # o log parcial de cada aparelho é lido aqui, depois, com a mensagem inteira de cada falha (inclusive a geometria)
          for L in build/xcodebuild-test.log build/xcodebuild-test-ipad.log; do [ -f "$L" ] || continue
            D=iphone; case "$L" in *ipad*) D=ipad;; esac
            { echo "commit $GITHUB_SHA · execução $GITHUB_RUN_NUMBER · $D · $(wc -l < "$L") linhas no log"
              echo "==== falhas (mensagem completa) ===="; grep -E "error: |Test Case .*failed" "$L" | grep -v -E "ProcessAssertion|makeImagePlus|WEBP" | head -n 400
              echo "==== último teste que começou (se o passo foi interrompido) ===="; grep -E "Test Case .*started" "$L" | tail -n 1
              echo "==== totais ===="; grep -E "Executed [0-9]+ test" "$L" | tail -n 3; } > "$OUT/FALHAS-$D.txt" 2>&1 || true
            tail -c 3000000 "$L" > "$OUT/log-$D-final.txt" 2>/dev/null || true
          done
          grep -hE "warning:" build/xcodebuild-release.log 2>/dev/null | sort -u | head -n 300 > "$OUT/AVISOS.txt" || true
          # N07 (17/11): quando o app de teste cai, guarda o que aconteceu antes da queda e o relatório de crash do macOS,
          # pra achar a causa (o pacote de resultados do Actions não é acessível de fora). Só leitura; não muda nenhum teste.
          { for L in build/xcodebuild-test.log build/xcodebuild-test-ipad.log; do [ -f "$L" ] || continue; echo "######## $L";
              grep -n -E "Restarting after unexpected exit|crashed|Test crashed|lost connection" "$L" | cut -d: -f1 | head -n 6 | while read N; do
                echo "==== linhas $((N>80?N-80:1))..$((N+5))"; sed -n "$((N>80?N-80:1)),$((N+5))p" "$L" | grep -v -E "makeImagePlus|WEBP|CHHapticPattern" | cut -c1-400; done; done;
            echo "######## xcresult (iPhone A)"; xcrun xcresulttool get test-results summary --path build/Testes.xcresult 2>&1 | head -n 120; echo "######## xcresult (iPhone B)"; xcrun xcresulttool get test-results summary --path build/TestesB.xcresult 2>&1 | head -n 120;
          } > "$OUT/QUEDAS.txt" 2>&1 || true
          # RECURSO-DIAG: processos do WebKit e do app ao longo da bateria, e as linhas RECURSO-DIAG que os testes imprimem
          for D in iphone ipad; do { [ -f build/processos-$D.log ] && cat build/processos-$D.log; [ $D = iphone ] && [ -f build/processos-iphone-b.log ] && { echo "######## passo B"; cat build/processos-iphone-b.log; }; L=build/xcodebuild-test.log; [ $D = ipad ] && L=build/xcodebuild-test-ipad.log;
            echo "==== RECURSO-DIAG dos testes ===="; grep -hE "RECURSO-DIAG|Restarting after|exceeded execution|didBecomeUnresponsive" "$L" 2>/dev/null | cut -c1-300 | head -n 400; } > "$OUT/PROCESSOS-$D.txt" 2>&1 || true; done
          mkdir -p "$OUT/crash"
          find ~/Library/Logs/DiagnosticReports -maxdepth 2 -type f \( -name "*.ips" -o -name "*.crash" \) -mmin -240 2>/dev/null | grep -i -E "Arquemestre|WebContent|xctest|WebKit|GPU|Jetsam" | head -n 12 | while read F; do head -c 400000 "$F" > "$OUT/crash/$(basename "$F")"; done || true
          cd "$OUT"
          git init -q && git checkout -q -b ci/ios-resultados
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Resultados iOS $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/ios-resultados
          # Adauto 25/11: execuções de ramos diferentes não apagam as evidências umas das outras.
          # Além do ci/ios-resultados de sempre, cada ramo tem o seu ci/ios-resultados-<ramo>.
          RB="ci/ios-resultados-$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$RB" || true
          echo "::notice title=Resultados iOS guardados::$RB"
          T=$(grep -hE "Executed [0-9]+ test" RESUMO.txt | tail -n1)
          echo "::notice title=Testes iOS::${T:-sem resumo}"

      - name: Resumo dos erros
        if: ${{ !inputs.testado_em && (failure()) }}
        run: |
          cd ios
          M=$( (grep -hE "error:|Failing|failed|XCTAssert" build/*.log 2>/dev/null | head -120) | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Erros do build iOS::$M"

      - name: Publicar capturas, testes e logs
        if: ${{ !inputs.testado_em && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-resultados
          path: |
            ios/build/capturas/
            ios/build/*.log
            ios/build/Testes.xcresult
            ios/build/TestesB.xcresult
          if-no-files-found: ignore

      # ---- só com a conta Apple paga e com confirmação manual (botão "Run workflow") ----
      - name: Enviar ao TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # a chave .p8 pode vir colada como texto (ASC_KEY_P8, mais fácil) ou em base64 (ASC_KEY_P8_B64)
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ] || { [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_B64" ]; }; then
            echo "::error::Faltam segredos: ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID e ASC_KEY_P8 (texto do arquivo .p8)"; exit 1
          fi
          cd ios
          mkdir -p ~/private_keys
          if [ -n "$ASC_KEY_P8" ]; then printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          else echo "$ASC_KEY_P8_B64" | base64 -d > ~/private_keys/AuthKey_$ASC_KEY_ID.p8; fi
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # archive sem assinar (igual ao main): a assinatura de distribuição sai no export, sem precisar de aparelho cadastrado
          xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Arquemestre.xcarchive DEVELOPMENT_TEAM=$APPLE_TEAM_ID CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Arquemestre.xcarchive -exportOptionsPlist build/export.plist -exportPath build/export $AUTH
          rm -rf ~/private_keys

  # BATERIA-2-PASSOS / QUEDA-PARALELO (Chefe 25/11): o iPad roda num job próprio (outro Mac), com os mesmos 100 min de antes, autorizados
  # pelo Adauto, e a mesma tolerância por teste. Nunca divide a memória com o iPhone. Os resultados vão pra ci/ios-resultados-<ramo>-ipad.
  ipad:
    if: ${{ !inputs.testado_em }}
    runs-on: macos-26
    timeout-minutes: 210
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Xcode 26 (exigido pela App Store desde 28/04/2026)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$X" ] || X=/Applications/Xcode.app
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Gerar o projeto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compilar os testes (iPad)
        id: ipad_build
        timeout-minutes: 40
        run: |
          cd ios && mkdir -p build
          UDID=$(python3 scripts/pick_sim.py ipad)
          set -o pipefail
          xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            build-for-testing > build/xcodebuild-build-ipad.log 2>&1 || { grep -E "error:" build/xcodebuild-build-ipad.log | head -n 60; exit 1; }

      # a mesma bateria de testes também no iPad (tela grande, toques e 3D): o que roda no iPhone tem que rodar no iPad
      # Adauto 17/11: o iPad roda mesmo quando o iPhone falha (antes, qualquer falha no iPhone pulava o iPad e ele nunca tinha resultado)
      - name: Testes no iPad (mesma bateria do iPhone)
        id: ipad_tests
        if: always() && steps.ipad_build.outcome == 'success'
        # 25/11: a bateria do iPad já levava 73 dos 75 min (iOS 689) e no 691 estourou antes de imprimir as falhas; 100 min cabem nos 210 do job
        timeout-minutes: 100
        run: |
          cd ios && mkdir -p build
          UDID=$(python3 scripts/pick_sim.py ipad)
          # Adauto 24/11: aquece o simulador do iPad antes da bateria (liga e espera terminar de iniciar).
          # O teste não mudou: a 1ª abertura do app continua com o limite de 20 s e o tempo sai no ABERTURA-DIAG (página / editor / total).
          T0=$(date +%s); xcrun simctl boot "$UDID" 2>/dev/null; xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          echo "ABERTURA-DIAG simulador do iPad ligado em $(( $(date +%s) - T0 )) s (antes da bateria)"
          # Chefe 25/11 (run 695): o simulador escolhido sumiu da lista depois de ligar ("Unable to find a device").
          # Se não estiver mais disponível, escolhe de novo e liga, em vez de perder a bateria do iPad inteira.
          if ! xcrun simctl list devices available | grep -q "$UDID"; then
            echo "::warning title=Simulador do iPad::$UDID sumiu depois de ligar; escolhendo outro"
            UDID=$(python3 scripts/pick_sim.py ipad); xcrun simctl boot "$UDID" 2>/dev/null; xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
            echo "ABERTURA-DIAG simulador do iPad (2ª escolha $UDID) ligado em $(( $(date +%s) - T0 )) s"
          fi
          bash scripts/amostra_processos.sh build/processos-ipad.log & AMOSTRA=$!
          set +e
          xcodebuild -project Arquemestre.xcodeproj -scheme Arquemestre -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/TestesIPad.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 \
            -skip-testing:ArquemestreTests/SubscriptionTests -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            test-without-building > build/xcodebuild-test-ipad.log 2>&1
          RC=$?
          kill $AMOSTRA 2>/dev/null
          grep -E "error:|Test Case .*failed|Executed|\*\* " build/xcodebuild-test-ipad.log | grep -v -E "ProcessAssertion|makeImagePlus|WEBP"  | tail -n 120
          echo "==== CADERNO (medidas) ===="; grep -hE "CADERNO-PERF|Test Case .*CadernoTests" build/xcodebuild-test-ipad.log | head -n 80
          exit $RC

      - name: Guardar o resultado do iPad no ramo ci/ios-resultados-<ramo>-ipad
        if: always() && github.event_name != 'pull_request'
        run: |
          cd ios
          OUT=$(mktemp -d); L=build/xcodebuild-test-ipad.log
          if [ -f "$L" ]; then
            { echo "commit $GITHUB_SHA · execução $GITHUB_RUN_NUMBER · ipad · $(wc -l < "$L") linhas no log"
              echo "==== falhas (mensagem completa) ===="; grep -E "error: |Test Case .*failed" "$L" | grep -v -E "ProcessAssertion|makeImagePlus|WEBP" | head -n 400
              echo "==== último teste que começou (se o passo foi interrompido) ===="; grep -E "Test Case .*started" "$L" | tail -n 1
              echo "==== totais ===="; grep -E "Executed [0-9]+ test" "$L" | tail -n 3; } > "$OUT/FALHAS-ipad.txt" 2>&1 || true
            tail -c 3000000 "$L" > "$OUT/log-ipad-final.txt" 2>/dev/null || true
            grep -oE "Test Case '-\[[^]]+\]' failed" "$L" | sed -E "s/Test Case '-\[(.*)\]' failed/\1/" | sort -u | while read T; do
              if grep -qF "Test Case '-[$T]' passed" "$L"; then echo "iPad · só passou na repetição · $T"; else echo "iPad · FALHOU nas duas · $T"; fi
            done > "$OUT/REPETIDOS-ipad.txt" || true
            { echo "commit $GITHUB_SHA · execução $GITHUB_RUN_NUMBER · ipad"; grep -hE "ABERTURA-DIAG" "$L" | head -n 40; grep -E "Executed [0-9]+ test" "$L" | tail -n 3; } > "$OUT/RESUMO-ipad.txt" || true
            { [ -f build/processos-ipad.log ] && cat build/processos-ipad.log; echo "==== RECURSO-DIAG dos testes ===="; grep -hE "RECURSO-DIAG|Restarting after|exceeded execution|didBecomeUnresponsive" "$L" | cut -c1-300 | head -n 400; } > "$OUT/PROCESSOS-ipad.txt" 2>&1 || true
            { grep -n -E "Restarting after unexpected exit|crashed|Test crashed|lost connection" "$L" | cut -d: -f1 | head -n 6 | while read N; do
                echo "==== linhas $((N>80?N-80:1))..$((N+5))"; sed -n "$((N>80?N-80:1)),$((N+5))p" "$L" | grep -v -E "makeImagePlus|WEBP|CHHapticPattern" | cut -c1-400; done; } > "$OUT/QUEDAS-ipad.txt" 2>&1 || true
          else
            grep -E "error:" build/xcodebuild-build-ipad.log 2>/dev/null | head -n 100 > "$OUT/FALHAS-ipad.txt"; echo "sem log de teste (a compilação falhou?)" >> "$OUT/FALHAS-ipad.txt"
          fi
          cd "$OUT"
          git init -q && git checkout -q -b ci/ios-resultados-ipad
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Resultados iPad $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          RB="ci/ios-resultados-$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')-ipad"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$RB" || true
          echo "::notice title=Resultados do iPad guardados::$RB"

      - name: Publicar os logs do iPad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-resultados-ipad
          path: |
            ios/build/*.log
            ios/build/TestesIPad.xcresult
          if-no-files-found: ignore
