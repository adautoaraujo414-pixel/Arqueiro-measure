name: Android · demonstração isolada (somente teste)
on:
  push:
    branches: [ 'codex/play-review-access' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar apenas pacote descartável de teste e executar testes JVM
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testSiteDebugUnitTest assemblePlayDebug assemblePlayDebugAndroidTest -Pteste=1
      - name: Aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -prop persist.sys.language=pt -prop persist.sys.country=BR'
          script: bash .github/scripts/teste_demonstracao.sh
      - name: Guardar relatórios e binário de teste (sem distribuição)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demonstracao-teste-relatorios
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/play/debug/
