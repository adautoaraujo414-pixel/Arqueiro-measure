name: Windows · teste de atualização

# N05 (auditoria de 17/11, autorizado pelo Adauto): instala a versão publicada do Windows, põe os dados do backup de referência,
# instala por cima o instalador deste commit e confere que nada foi perdido. Só teste: não cria release nem mexe em ponteiro.
on:
  # roda sozinho só quando o próprio teste muda (o GitHub precisa disso pra liberar o disparo manual numa branch)
  push:
    paths: [ '.github/workflows/windows-atualizacao.yml', '.github/scripts/teste_atualizacao_windows.ps1', '.github/scripts/video_cdp.py' ]
  workflow_dispatch:
    inputs:
      anterior:
        description: 'Release da versão anterior (padrão: win-166, a publicada em 22/11 (c561120))'
        default: 'win-166'

permissions:
  contents: read

jobs:
  atualizacao:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trava de publicação (compilar nunca publica)
        run: python .github/scripts/trava_publicacao.py

      - name: Instalador da versão nova (deste commit)
        working-directory: windows
        run: |
          # a versão do instalador vem do GITHUB_RUN_NUMBER, que aqui é o contador DESTE workflow (1, 2, 3…) e ficaria menor que a publicada.
          # Só nesta compilação de teste: 60000 + contador (o MSI aceita até 65535).
          $env:GITHUB_RUN_NUMBER = "$(60000 + [int]$env:GITHUB_RUN_NUMBER)"; Write-Host "versão de teste: 1.0.$env:GITHUB_RUN_NUMBER"
          gradle --no-daemon packageMsi

      - name: Baixar a versão anterior publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.anterior }}'; if (-not $tag) { $tag = 'win-166' }
          gh release download $tag -p 'Arquemestre-Windows.msi' -D anterior -R ${{ github.repository }}
          Get-ChildItem anterior

      - name: Atualizar por cima e conferir os dados
        run: |
          $new = (Get-ChildItem windows/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName
          ./.github/scripts/teste_atualizacao_windows.ps1 -Old (Resolve-Path anterior/Arquemestre-Windows.msi).Path -New $new

      - name: Guardar o resultado
        if: always()
        run: |
          Write-Host "(resultado no log acima; listas em atualizacao/)"
          Get-ChildItem atualizacao -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "---- $($_.Name)"; Get-Content $_.FullName | Select-Object -First 40 }
