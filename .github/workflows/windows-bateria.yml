name: Windows · bateria do editor

# Roda a bateria do editor de móveis (os MESMOS testes do iOS: ios/ArquemestreTests/EditorWebKitTests.swift)
# dentro do Arquemestre do Windows de verdade (o navegador embutido dele), pra conferir que o editor dá o mesmo
# resultado no Windows, no iOS e no Android.
# Só testa: não gera instalador pra ninguém, não cria release e não mexe na versão dos usuários.
on:
  workflow_dispatch:
  push:
    branches: [ 'feature/**' ]
    paths:
      - 'app/src/main/assets/editor.html'
      - 'ios/ArquemestreTests/EditorWebKitTests.swift'
      - 'windows/**'
      - 'tools/bateria_editor.py'
      - '.github/workflows/windows-bateria.yml'

permissions:
  contents: read

concurrency:
  group: windows-bateria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bateria:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trava de publicação (compilar nunca publica)
        run: python .github/scripts/trava_publicacao.py

      - name: App do Windows (pasta pronta pra rodar, sem instalador)
        working-directory: windows
        run: gradle --no-daemon createDistributable

      - name: Bateria do editor dentro do app (motor do Windows)
        run: |
          pip install --quiet websocket-client
          $exe = Get-ChildItem windows/build/compose/binaries/main/app/Arquemestre/Arquemestre.exe
          Write-Host "app: $($exe.FullName)"
          $env:ARQUE_BATERIA = "1"
          $env:ARQUE_CDP_PORT = "9333"
          $p = Start-Process $exe.FullName -PassThru
          python tools/bateria_editor.py --cdp http://127.0.0.1:9333 --saida bateria-windows
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process Arquemestre, jcef_helper -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $code

      - name: Resultado da bateria (arquivo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bateria-windows
          path: bateria-windows
          if-no-files-found: ignore
