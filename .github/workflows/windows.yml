name: Windows

# Versão Windows do Arquemestre (pasta windows/): compila, testa no Windows de verdade,
# gera o instalador (.exe e .msi) e a versão portátil (.zip) e publica no release win-N.
# Não mexe no Android nem no iOS (tem build e workflow próprios).
on:
  # Só roda quando disparado à mão.
  # TESTAR (modo "teste"): compila, testa e guarda os instaladores como arquivo de teste. Nunca mexe na versão dos usuários.
  # PUBLICAR: modo "publicar" e escrevendo a confirmação "PUBLICAR <7 letras do commit>".
  workflow_dispatch:
    inputs:
      modo:
        description: 'teste = só compila e guarda os arquivos · publicar = atualiza a versão dos usuários'
        type: choice
        options: [ teste, publicar ]
        default: teste
      confirmar:
        description: 'Só pra publicar: escreva PUBLICAR e as 7 primeiras letras do commit (ex.: PUBLICAR a54f405)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico e tags: as novidades saem dos commits desde o win-N anterior
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trava de publicação (compilar nunca publica)
        run: python .github/scripts/trava_publicacao.py

      - name: Testes automáticos (JVM, no Windows)
        working-directory: windows
        run: gradle --no-daemon test

      - name: Instalador e versão portátil
        working-directory: windows
        run: gradle --no-daemon packageExe packageMsi createDistributable

      - name: Instalar (MSI, sem perguntas) e testar o app instalado
        run: |
          $msi = Get-ChildItem windows/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Write-Host "MSI: $($msi.FullName) ($([math]::Round($msi.Length/1MB)) MB)"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v msi-install.log" -Wait -PassThru
          Write-Host "msiexec saiu com $($p.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Arquemestre\Arquemestre.exe","$env:ProgramFiles\Arquemestre\Arquemestre.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-Content msi-install.log -Tail 60; throw "app instalado não encontrado" }
          Write-Host "instalado em $($exe.FullName)"
          "ARQUE_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory -Force tour | Out-Null
          $env:ARQUE_TOUR = (Resolve-Path tour).Path
          python windows/test/tour.py "$($exe.FullName)" tour

      - name: Arquivos de TESTE (portátil e instalador, sem publicar)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.modo == 'teste'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = $env:GITHUB_RUN_NUMBER
          New-Item -ItemType Directory -Force relt | Out-Null
          Compress-Archive -Path windows/build/compose/binaries/main/app/Arquemestre -DestinationPath relt/Arquemestre-Windows-TESTE-portatil.zip
          "Arquivos de TESTE do commit $($env:GITHUB_SHA.Substring(0,7)). Nao e versao publica e nao atualiza ninguem. O portatil roda sem instalar (descompacte e abra Arquemestre.exe); ele usa a mesma pasta de dados do app instalado, entao faca backup antes." | Out-File -Encoding utf8NoBOM relt/nota.txt
          gh release create "teste-windows-$n" relt/Arquemestre-Windows-TESTE-portatil.zip -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title "TESTE Windows $n ($($env:GITHUB_SHA.Substring(0,7))) · não é versão pública" --notes-file relt/nota.txt

      - name: PUBLICAR pros usuários (release win-N e ponteiro win-latest)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.modo == 'publicar'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          python .github/scripts/trava_publicacao.py confirmar "$env:CONFIRMAR"
          if ($LASTEXITCODE -ne 0) { throw "publicação recusada pela trava" }
          $n = $env:GITHUB_RUN_NUMBER
          $exe = Get-ChildItem windows/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          $msi = Get-ChildItem windows/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          New-Item -ItemType Directory -Force rel | Out-Null
          Copy-Item $exe.FullName rel/Arquemestre-Windows-Instalador.exe
          Copy-Item $msi.FullName rel/Arquemestre-Windows.msi
          Compress-Archive -Path windows/build/compose/binaries/main/app/Arquemestre -DestinationPath rel/Arquemestre-Windows-portatil.zip
          # novidades desta versão (o app mostra no aviso de atualização): commits desde o win-N anterior
          python .github/scripts/novidades.py win- "win-$n" | Out-File -Encoding utf8NoBOM rel/novidades.txt
          if (-not (Test-Path rel/novidades.txt) -or (Get-Item rel/novidades.txt).Length -lt 5) { "Novidades desta versão:`nMelhorias e correções." | Out-File -Encoding utf8NoBOM rel/novidades.txt }
          Get-Content rel/novidades.txt
          $nf = Join-Path $env:RUNNER_TEMP notas.txt
          (Get-Content rel/novidades.txt -Raw) + "`n`nInstalador: Arquemestre-Windows-Instalador.exe (ou o .msi). Portátil: descompacte o .zip e abra Arquemestre.exe. Os dados ficam em %LOCALAPPDATA%\Arque\Arquemestre e os backups em Documentos\Arquemestre\Backups." | Out-File -Encoding utf8NoBOM $nf
          gh release create "win-$n" rel/* -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease `
            --title "Arquemestre para Windows $n" `
            --notes-file $nf
          # ponteiro fixo "win-latest": o app lê latest.txt direto do download (sem feed, sem limite da API)
          Set-Content -Path rel/latest.txt -Value "$n" -NoNewline
          gh release view win-latest -R "$env:GITHUB_REPOSITORY" 2>$null; if ($LASTEXITCODE -ne 0) { gh release create win-latest -R "$env:GITHUB_REPOSITORY" --prerelease --title "Windows · última versão (ponteiro)" --notes "Usado pelo app pra se atualizar sozinho. A versão de verdade está em win-N." }
          gh release upload win-latest rel/latest.txt rel/novidades.txt rel/Arquemestre-Windows-Instalador.exe -R "$env:GITHUB_REPOSITORY" --clobber

      - name: PUBLICAR o instalador para Windows 7/8 (Chromium 109)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.modo == 'publicar'
        working-directory: windows
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          python ../.github/scripts/trava_publicacao.py confirmar "$env:CONFIRMAR"
          if ($LASTEXITCODE -ne 0) { throw "publicação recusada pela trava" }
          # o Chromium 135 não roda no Windows 7/8/8.1 (chrome_elf.dll: procedimento não encontrado):
          # este instalador usa o Chromium 109 (o último que roda neles) e se atualiza com o mesmo tipo
          gradle --no-daemon packageExe -Pwin7=1
          $exe = Get-ChildItem build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName Arquemestre-Windows7-Instalador.exe
          Write-Host "Windows 7/8: $([math]::Round((Get-Item Arquemestre-Windows7-Instalador.exe).Length/1MB)) MB"
          # o GitHub às vezes responde 500 no envio: tenta de novo
          foreach ($tag in @("win-$env:GITHUB_RUN_NUMBER","win-latest")) {
            $ok = $false
            for ($i = 1; $i -le 4 -and -not $ok; $i++) {
              gh release upload $tag Arquemestre-Windows7-Instalador.exe -R "$env:GITHUB_REPOSITORY" --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "envio falhou ($tag), tentativa $i"; Start-Sleep -Seconds (15 * $i) }
            }
            if (-not $ok) { throw "não consegui enviar o instalador do Windows 7/8 pra $tag" }
          }

      - name: Guardar resultados (prints e relatório) no ramo ci/windows-resultados
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if (Test-Path tour) { Copy-Item -Recurse tour out/tour }
          if (Test-Path msi-install.log) { Get-Content msi-install.log -Tail 200 | Out-File out/msi-install-tail.log }
          Get-ChildItem windows/build/test-results/test/*.xml -ErrorAction SilentlyContinue | Copy-Item -Destination out/
          "run $env:GITHUB_RUN_NUMBER sha $env:GITHUB_SHA" | Out-File out/RUN.txt
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch origin ci/windows-resultados 2>$null
          git switch --orphan tmp-res
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','out') } | Remove-Item -Recurse -Force
          Move-Item out/* . ; Remove-Item out
          git add -A; git commit -q -m "Resultados Windows $env:GITHUB_RUN_NUMBER ($env:GITHUB_SHA)"
          git push -f origin HEAD:ci/windows-resultados
