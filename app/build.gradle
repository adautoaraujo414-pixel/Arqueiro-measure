plugins { id 'com.android.application' }
def releaseKeyPath = System.getenv('ARQUE_KEYSTORE_PATH')
def releaseKeyPass = System.getenv('ARQUE_KEYSTORE_PASSWORD')
def releaseAlias = System.getenv('ARQUE_KEY_ALIAS')
def releasePass = System.getenv('ARQUE_KEY_PASSWORD')
android {
    namespace 'com.arque.measure'
    compileSdk 35
    defaultConfig { applicationId 'com.arque.measure'; minSdk 26; targetSdk 35; versionCode 10; versionName '0.10.0-alpha' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        arqueRelease {
            if (releaseKeyPath && releaseKeyPass && releaseAlias && releasePass) {
                storeFile file(releaseKeyPath)
                storePassword releaseKeyPass
                keyAlias releaseAlias
                keyPassword releasePass
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeyPath && releaseKeyPass && releaseAlias && releasePass) signingConfig signingConfigs.arqueRelease
            minifyEnabled false
        }
    }
}
