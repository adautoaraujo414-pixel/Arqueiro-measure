function restoreMob(saved){if(!saved||!Array.isArray(saved.modules))return;['stone','base','walls','divs','shelves','fills','th','height','seq','client','project','sheetL','sheetW','offsetW','offsetD','railHeight','railRecess','modules','activeId','moduleSelection','moduleSeq','orbit','pitch','panX','panY','appliances','applianceSeq','selectedAppliance','room'].forEach(k=>{if(saved[k]!==undefined)st[k]=saved[k]});st.view=st.modules.length?'ambient':'front'}

function persist(){try{ensureModule();syncCurrent();const json=JSON.stringify({version:'0.20',appliances:st.appliances,applianceSeq:st.applianceSeq,room:st.room,stone:st.stone,base:st.base,walls:st.walls,divs:st.divs,shelves:st.shelves,fills:st.fills,th:st.th,height:st.height,seq:st.seq,client:st.client,project:st.project,sheetL:st.sheetL,sheetW:st.sheetW,offsetW:st.offsetW,offsetD:st.offsetD,railHeight:st.railHeight,railRecess:st.railRecess,modules:st.modules,activeId:st.activeId,moduleSelection:st.moduleSelection,moduleSeq:st.moduleSeq,orbit:st.orbit,pitch:st.pitch,panX:st.panX,panY:st.panY});localStorage.setItem(saveKey,json);if(linkedProject)linkedWrite=linkedWrite.then(()=>saveToMeasure(json)).catch(e=>console.warn('Arque Mob: erro salvando projeto',e))}catch(e){}}
// Camera 3D técnica: projeção ortográfica de peças reais (em cm), não imagem estática.
function scene3d(){
 syncCurrent();const mods=st.modules.filter(m=>m.base).slice().sort((a,b)=>a.x-b.x);

function render(){sc.setAttribute('viewBox',`${500-500/st.zoom} ${320-320/st.zoom} ${1000/st.zoom} ${640/st.zoom}`);sc.innerHTML=st.view==='ambient'?ambient():st.view==='top'?plant():st.view==='front'?front():st.view==='iso'?allIsometric():isometric();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===st.view));document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===st.tool));const b=st.base;let txt=st.view==='ambient'?'1. Ambiente 3D' :st.view==='top'?'2. Pedra e paredes':st.view==='front'?'3. Construa com riscos':'4. Veja o móvel';$('steps').innerHTML=`<strong>${txt.split('.')[0]}.</strong> ${txt.split('. ')[1]}`;let hint=!st.stone?'Puxe o dedo em diagonal para desenhar sua <b>pedra</b>':!b?'Faça uma base':'Na <b>Frente</b>: risco vertical = lateral, horizontal = prateleira. Toque no vão para preencher';if(st.view==='ambient')hint=st.modules.length?'Arraste o <b>fundo</b> para girar. Arraste o armário para mover; use pinça para zoom e deslocar.':'Crie um <b>exemplo</b> ou desenhe sua bancada na Planta.';if(st.view==='iso')hint=st.modules.length>1?'Toque no armário ou equipamento e arraste; no vazio, gire a câmera.':'Veja seu móvel em <b>3D</b>. Para mexer nas peças, volte em Frente.';if(st.tool==='wall')hint='Desenhe a <b>parede</b> com um risco na planta.';if(st.tool==='move'&&st.view!=='ambient')hint='Puxe as <b>laterais</b> e prateleiras. As medidas mudam ao vivo.';$('hint').innerHTML='<span>'+hint+'</span>';if(!st.drag&&!st.draw){$('liveTitle').textContent='Medida agora';$('liveMeasure').textContent=st.view==='ambient'?(st.modules.find(m=>m.id===st.moduleSelection)?.base?unit(st.modules.find(m=>m.id===st.moduleSelection).base.w):'—'):st.bay!==null?unit(boxes()[st.bay]?.width||0):b?unit(b.w):'—';$('liveSubtitle').textContent=st.view==='ambient'?'largura selecionada':st.bay!==null?'largura do vão':b?'largura da base':'desenhe para medir'}actions()}

function createStone(a){if(a.w-st.offsetW>st.room.width)return toast('A bancada ultrapassa a largura do ambiente. Aumente a parede primeiro.');if(a.w<20||a.d<15)return toast('Aumente o desenho da pedra.');checkpoint();st.stone={...a};const bw=rd(a.w-st.offsetW),bd=rd(a.d-st.offsetD);st.base=bw>0&&bd>0?{x:rd(a.x+st.offsetW/2),y:rd(a.y+st.offsetD/2),w:bw,d:bd,rail:true}:null;st.divs=[];st.shelves=[];st.fills={};st.bay=null;st.view='front';st.tool='draw';render();persist();toast(`Pedra ${unit(a.w)} × ${unit(a.d)}. Base ${unit(bw)} × ${unit(bd)} criada.`)}

function divide(n){if(!st.base)return;let t=st.th,W=st.base.w;if(n<1||n>15||(W-t*(n-1))/n<7)return toast('Não cabe essa quantidade de vãos.');checkpoint();let v=(W-t*(n-1))/n;st.divs=[];for(let i=1;i<n;i++)st.divs.push({id:'d'+st.seq++,x:rd(v*i+t*(i-1)),t});st.shelves=[];st.fills={};st.selected=null;st.bay=null;render();persist();toast(`${n} vãos iguais criados.`)}

function fill(type){if(st.bay===null)return;const b=boxes()[st.bay];if(!b)return;checkpoint();if(type==='shelves'){st.shelves.push({id:'s'+st.seq++,bay:st.bay,z:rd(st.height/2)});toast('Prateleira inserida. Arraste para cima ou para baixo.')}

function plan(src=st){let ls=[],add=(q,name,w,h,note='')=>{if(q>0&&w>0&&h>0)ls.push({q,name,w:rd(w),h:rd(h),note})};let b=src.base;if(!b)return ls;add(1,'Base',b.w,b.d);if(b.rail)add(1,'Régua superior contínua',b.w,src.railHeight,`Recuo frontal ${src.railRecess} cm; conferir acabamento cava 30°`);add(2,'Laterais externas',b.d,src.height-src.th,'Conferir rasgo da régua');add(src.divs.length,'Divisórias internas',b.d,src.height-src.th,'Conferir rasgo da régua');src.divs.forEach(()=>{});for(const sh of src.shelves){const v=boxesFor(src)[sh.bay];if(v)add(1,'Prateleira do vão '+(sh.bay+1),v.width,b.d-2)}for(const v of boxesFor(src)){const f=src.fills[v.index];if(!f)continue;if(f.type==='doors'){let w=(v.width+1.2)/f.qty,h=src.height-src.railHeight+2.5;add(f.qty,'Porta do vão '+(v.index+1),w,h,'Confirmar folgas/dobradiças')}

function boxesFor(src){if(!src.base)return [];const ds=src.divs.slice().sort((a,b)=>a.x-b.x);let p=0;return [...ds,{x:src.base.w,t:0}].map((d,i)=>{const v={index:i,start:p,end:d.x,width:rd(Math.max(0,d.x-p))};p=d.x+d.t;return v})}
function planAll(){syncCurrent();return st.modules.length?st.modules.flatMap(m=>plan(m).map(p=>({...p,name:m.label+' · '+p.name}))):plan(st)}

function showNumber(kind){const options=kind==='equal'?{title:'Quantos vãos iguais?',desc:'Exemplo: 3. As divisórias já entram na conta.',v:3}:kind==='pos'?{title:'Posição exata',desc:'Distância em centímetros, a partir da esquerda ou da base.',v:(st.divs.find(d=>d.id===st.selected)?.x||st.shelves.find(s=>s.id===st.selected)?.z||0)}:{title:'Quantidade',desc:'',v:1};sheet(`<div class="sheetrow"><h3 style="flex:1">${options.title}</h3><button class="action" data-modal="close">×</button></div><p>${options.desc}</p><div class="sheetrow"><input type="number" id="numberV" step="${kind==='equal'?1:0.1}" min="0" value="${options.v}"><button class="action primary" data-modal="number" data-kind="${kind}">Aplicar</button></div>`);$('numberV').focus()}
function sendFile(filename,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000)}
function handleAction(type){if(type==='sample'||type==='demo'){sample();toast('Exemplo pronto! Arraste as laterais com o dedo.')}else if(type==='equal')showNumber('equal');else if(type==='pieces')showPieces();else if(type==='empty'){checkpoint();st.modules=[];st.activeId=null;st.moduleSelection=null;st.moduleSeq=1;st.appliances=[];st.applianceSeq=1;st.selectedAppliance=null;st.selectedPart=null;st.selectedRoomItem=null;st.room={width:450,depth:300,height:270,windows:[],walls:[],seq:1};st.stone=null;st.base=null;st.divs=[];st.shelves=[];st.fills={};st.walls=[];st.view='top';st.tool='draw';st.bay=null;st.selected=null;render();persist()}
else if(type==='roomEdit'){roomEditor()}else if(type==='part3dProps'){part3dEditor()}else if(type==='roomSelected'){const q=st.room.windows.find(q=>q.id===st.selectedRoomItem);if(q)windowEditor(q.id);else wallEditor(st.selectedRoomItem)}else if(type==='equipmentAdd'){equipmentPicker()}else if(type==='equipmentProps'){equipmentEditor()}else if(type==='moduleEdit'){startEditSelected()}else if(type==='moduleDuplicate'){duplicateModule()}else if(type==='moduleProps'){moduleEditor()}else if(type==='close'){st.bay=null;st.selected=null;render()}else if(type==='clearbay'){checkpoint();delete st.fills[st.bay];st.shelves=st.shelves.filter(s=>s.bay!==st.bay);render();persist()}else if(type==='fewer')modifyQty(-1);else if(type==='more')modifyQty(1);
else if(type==='remove'){checkpoint();st.divs=st.divs.filter(d=>d.id!==st.selected);st.shelves=st.shelves.filter(s=>s.id!==st.selected);st.fills={};st.selected=null;st.bay=null;render();persist()}
else if(type==='copy'){const d=st.divs.find(i=>i.id===st.selected);const sh=st.shelves.find(i=>i.id===st.selected);if(d){if(divider(d.x+12))toast('Lateral duplicada')}else if(sh){if(shelf((boxes()[sh.bay].start+boxes()[sh.bay].end)/2,sh.z+10))toast('Prateleira duplicada')}}else if(type==='selectpos')showNumber('pos');else if(type==='help')sheet(`<div class="sheetrow"><h3 style="flex:1">Como construir em 3 passos</h3><button class="action" data-modal="close">×</button></div><p><b>1.</b> Na Planta, arraste em diagonal para desenhar a pedra. A base respeita automaticamente os descontos de 7 cm na largura e 4 cm na profundidade.</p><p><b>2.</b> Na Frente, faça um risco de cima para baixo para criar uma lateral. Risco na horizontal cria prateleira. Puxe a lateral com o dedo para mudar o tamanho dos vãos.</p><p><b>3.</b> Toque em qualquer vão e escolha portas, gavetas ou porta-temperos. O plano de corte vai sendo calculado. Toque em 3D para visualizar.</p><button class="action primary" data-modal="close">Entendi</button>`)}
function roomEditor(){
 const r=st.room;
 sheet(`<div class="sheetrow"><h3 style="flex:1">Ambiente · Paredes e janelas</h3><button class="action" data-modal="close">×</button></div>
 <p>Medidas reais em cm. O cômodo muda de tamanho, mas os armários continuam com suas medidas. A parede de fundo corresponde à largura do ambiente.</p>
 <div class="sheetrow"><label>Largura do fundo (cm)<input id="roomW" type="number" min="100" max="3000" step="0.1" value="${r.width}"></label><label>Profundidade (cm)<input id="roomD" type="number" min="100" max="3000" step="0.1" value="${r.depth}"></label><label>Pé-direito (cm)<input id="roomH" type="number" min="160" max="700" step="0.1" value="${r.height}"></label></div>
 <div class="sheetrow" style="margin:10px 0 16px"><button class="action primary" data-modal="roomSave">Aplicar medidas</button></div>
 <h3>Janelas</h3><p>Escolha a parede, a distância desde o canto e a altura do piso.</p>

 ${r.windows.map(w=>`<div class="part"><span>${escapeHtml(w.side==='back'?'Fundo':'Esquerda')} · ${fmt(w.w)} × ${fmt(w.h)} cm · início ${fmt(w.x)} · peitoril ${fmt(w.z)}</span><button class="action" data-modal="windowEdit" data-id="${w.id}">Editar</button></div>`).join('')||'<p>Sem janelas cadastradas.</p>'}
 <h3>Parede adicional</h3><p>Posicione as duas extremidades na planta do cômodo.</p>
 <div class="sheetrow"><label>Início X<input id="wallX1" type="number" value="200"></label><label>Início Y<input id="wallY1" type="number" value="100"></label><label>Fim X<input id="wallX2" type="number" value="200"></label><label>Fim Y<input id="wallY2" type="number" value="260"></label><label>Altura<input id="wallH" type="number" value="270"></label><button class="action" data-modal="roomWallAdd">＋ Parede</button></div>
 ${r.walls.map(w=>`<div class="part"><span>Parede · ${fmt(Math.hypot(w.x2-w.x1,w.y2-w.y1))} cm · altura ${fmt(w.h)} cm</span><button class="action" data-modal="roomWallEdit" data-id="${w.id}">Editar</button></div>`).join('')||'<p>Sem paredes adicionais.</p>'}`);
}
function validWindow(v,except=null){const r=st.room,limit=v.side==='back'?r.width:r.depth;
 return ['back','left'].includes(v.side)&&[v.x,v.w,v.z,v.h].every(Number.isFinite)&&v.x>=0&&v.w>=20&&v.z>=0&&v.h>=20&&v.x+v.w<=limit&&v.z+v.h<=r.height&&!r.windows.some(q=>q.id!==except&&q.side===v.side&&v.x<q.x+q.w&&v.x+v.w>q.x&&v.z<q.z+q.h&&v.z+v.h>q.z);
}
function roomSave(){const w=Number($('roomW')?.value),d=Number($('roomD')?.value),h=Number($('roomH')?.value),r=st.room;
 if(![w,d,h].every(Number.isFinite)||w<100||w>3000||d<100||d>3000||h<160||h>700)return toast('Confira as medidas do ambiente.');
 if(st.modules.some(m=>m.base&&(m.x+m.base.w>w||m.height>h))||st.appliances.some(a=>a.type==='fridge'&&(a.x+a.w>w||a.h>h)))return toast('Há móvel ou geladeira maior que o espaço. Reposicione antes de reduzir o cômodo.');
 if(r.windows.some(v=>v.x+v.w>(v.side==='back'?w:d)||v.z+v.h>h)||r.walls.some(v=>Math.max(v.x1,v.x2)>w||Math.max(v.y1,v.y2)>d||v.h>h))return toast('Uma janela ou parede não cabe nas novas medidas. Edite antes de reduzir.');
 ambientCheckpoint();Object.assign(r,{width:rd(w),depth:rd(d),height:rd(h)});closeSheet();render();persist();toast('Ambiente atualizado, móveis na escala original.');}
function windowAdd(){const v={id:'win'+st.room.seq++,side:$('winSide').value,x:Number($('winX').value),w:Number($('winW').value),h:Number($('winH').value),z:Number($('winZ').value)};
 if(!validWindow(v))return toast('Janela fora da parede ou sobreposta. Confira as medidas.');ambientCheckpoint();st.room.windows.push(v);render();persist();roomEditor();toast('Janela adicionada.');}
function windowEditor(id){const v=st.room.windows.find(q=>q.id===id);if(!v)return roomEditor();st.selectedRoomItem=id;
 sheet(`<div class="sheetrow"><h3 style="flex:1">Janela · Propriedades</h3><button class="action" data-modal="close">×</button></div><div class="sheetrow"><label>Parede<select id="editWinSide"><option value="back" ${v.side==='back'?'selected':''}>Fundo</option><option value="left" ${v.side==='left'?'selected':''}>Esquerda</option></select></label><label>Início (cm)<input id="editWinX" type="number" value="${v.x}"></label><label>Largura<input id="editWinW" type="number" value="${v.w}"></label><label>Altura<input id="editWinH" type="number" value="${v.h}"></label><label>Peitoril<input id="editWinZ" type="number" value="${v.z}"></label></div><div class="sheetrow"><button class="action primary" data-modal="windowSave" data-id="${v.id}">Aplicar</button><button class="action danger" data-modal="windowDelete" data-id="${v.id}">Excluir</button><button class="action" data-modal="roomEdit">Voltar</button></div>`);
}
function windowSave(id){const v=st.room.windows.find(q=>q.id===id);if(!v)return;const next={...v,side:$('editWinSide').value,x:Number($('editWinX').value),w:Number($('editWinW').value),h:Number($('editWinH').value),z:Number($('editWinZ').value)};
 if(!validWindow(next,id))return toast('Janela fora da parede ou sobreposta.');ambientCheckpoint();Object.assign(v,next);st.selectedRoomItem=null;persist();render();roomEditor();toast('Janela atualizada.');}
function wallAdd(){const vals=['wallX1','wallY1','wallX2','wallY2','wallH'].map(k=>Number($(k)?.value));const [x1,y1,x2,y2,h]=vals,r=st.room;
 if(!vals.every(Number.isFinite)||x1<0||x2<0||y1<0||y2<0||Math.max(x1,x2)>r.width||Math.max(y1,y2)>r.depth||h<20||h>r.height||Math.hypot(x2-x1,y2-y1)<10)return toast('Parede fora do cômodo ou muito pequena.');
 ambientCheckpoint();r.walls.push({id:'wall'+r.seq++,x1:rd(x1),y1:rd(y1),x2:rd(x2),y2:rd(y2),h:rd(h)});render();persist();roomEditor();toast('Parede adicionada.');}
function wallEditor(id){const v=st.room.walls.find(q=>q.id===id);if(!v)return roomEditor();st.selectedRoomItem=id;
 sheet(`<div class="sheetrow"><h3 style="flex:1">Parede · Propriedades</h3><button class="action" data-modal="close">×</button></div><div class="sheetrow">${[['X inicial','x1'],['Y inicial','y1'],['X final','x2'],['Y final','y2'],['Altura','h']].map(([label,key])=>`<label>${label} (cm)<input id="wallEdit_${key}" type="number" value="${v[key]}" step="0.1"></label>`).join('')}</div><div class="sheetrow"><button class="action primary" data-modal="roomWallSave" data-id="${id}">Aplicar</button><button class="action danger" data-modal="roomWallDelete" data-id="${id}">Excluir</button><button class="action" data-modal="roomEdit">Voltar</button></div>`);
}
function wallSave(id){const v=st.room.walls.find(q=>q.id===id);if(!v)return;const vals=['x1','y1','x2','y2','h'].map(k=>Number($('wallEdit_'+k)?.value));const [x1,y1,x2,y2,h]=vals,r=st.room;
 if(!vals.every(Number.isFinite)||Math.min(x1,x2,y1,y2)<0||Math.max(x1,x2)>r.width||Math.max(y1,y2)>r.depth||h<20||h>r.height||Math.hypot(x2-x1,y2-y1)<10)return toast('Confira as medidas da parede.');ambientCheckpoint();Object.assign(v,{x1:rd(x1),y1:rd(y1),x2:rd(x2),y2:rd(y2),h:rd(h)});st.selectedRoomItem=null;render();persist();roomEditor();toast('Parede atualizada.');}
function cameraScale(){const r=st.room;return Math.min(3,740/Math.max(r.width+80,250),440/Math.max(r.height+r.depth*.45,170));}
function projectedX(dx,dy){const s=cameraScale(),ax=Math.cos(st.orbit||0)*s,ay=Math.sin(st.orbit||0)*Math.sin(st.pitch||.52)*s;return (dx*ax+dy*ay)/Math.max(.01,ax*ax+ay*ay)}
function projectedY(dx,dy){const s=cameraScale(),ax=Math.sin(st.orbit||0)*s,ay=-Math.cos(st.orbit||0)*Math.sin(st.pitch||.52)*s;return (dx*ax+dy*ay)/Math.max(.01,ax*ax+ay*ay)}
function projectedZ(dy){return -dy/Math.max(.3,Math.cos(st.pitch||.52)*cameraScale())}
function part3dEditor(){
 const part=st.selectedPart;if(!part)return moduleEditor();const m=st.modules.find(x=>x.id===part.moduleId);if(!m)return;
 const d=m.divs.find(x=>x.id===part.id),s=m.shelves.find(x=>x.id===part.id);
 let title=part.kind==='divider'?'Divisória vertical':part.kind==='shelf'?'Prateleira':part.kind==='rail'?'Régua da cava':'Base / laterais';
 let fields=part.kind==='divider'&&d?`<label>Posição X (cm)<input id="p3X" type="number" step="0.1" value="${d.x}"></label>`:part.kind==='shelf'&&s?`<label>Altura do piso (cm)<input id="p3Z" type="number" step="0.1" value="${s.z}"></label>`:part.kind==='rail'?`<label>Altura da régua (cm)<input id="p3Rail" type="number" step="0.1" value="${m.railHeight}"></label><label>Recuo frontal (cm)<input id="p3Inset" type="number" step="0.1" value="${m.railRecess}"></label>`:`<label>Espessura MDF (cm)<input id="p3Th" type="number" step="0.1" value="${m.th}"></label>`;
 sheet(`<div class="sheetrow"><h3 style="flex:1">${title} · ${escapeHtml(m.label)}</h3><button class="action" data-modal="close">×</button></div><p>Peça selecionada no ambiente 3D. Ajuste a medida exata em centímetros.</p><div class="sheetrow">${fields}</div><div class="sheetrow" style="margin-top:12px"><button class="action primary" data-modal="part3dSave">Aplicar medida</button><button class="action" data-modal="moduleEdit">Editar estrutura completa</button></div>`);
}
function savePart3d(){const p=st.selectedPart,m=st.modules.find(q=>q.id===p?.moduleId);if(!m)return;let k=p.kind,val;
 if(k==='divider'){val=Number($('p3X')?.value);const d=m.divs.find(x=>x.id===p.id);const others=m.divs.filter(q=>q.id!==p.id);if(!d||!Number.isFinite(val)||val<3||val>m.base.w-m.th-3||others.some(q=>Math.abs(q.x-val)<m.th+3))return toast('Posição de divisória inválida ou sobreposta.');ambientCheckpoint();d.x=rd(val);m.divs.sort((a,b)=>a.x-b.x);}
 else if(k==='shelf'){val=Number($('p3Z')?.value);const q=m.shelves.find(q=>q.id===p.id);if(!q||!Number.isFinite(val)||val<m.th+2||val>m.height-m.railHeight-m.th-2)return toast('Altura de prateleira inválida.');ambientCheckpoint();q.z=rd(val);}
 else if(k==='rail'){const r=Number($('p3Rail')?.value),rec=Number($('p3Inset')?.value);if(!Number.isFinite(r)||!Number.isFinite(rec)||r<2||r>20||r>m.height-m.th-5||rec<0||rec>5)return toast('Confira altura e recuo da régua.');ambientCheckpoint();m.railHeight=rd(r);m.railRecess=rd(rec);}
 else{val=Number($('p3Th')?.value);if(!Number.isFinite(val)||val<.6||val>5)return toast('Espessura de MDF inválida.');ambientCheckpoint();m.th=rd(val);m.divs.forEach(d=>d.t=rd(val));}
 if(st.activeId===m.id){st.activeId=null;loadModule(m.id)}closeSheet();render();persist();toast('Peça atualizada no 3D.');
}
function pointerDown(e){e.preventDefault();st.pointers.set(e.pointerId,coord(e));
 if(st.pointers.size>1){const points=[...st.pointers.values()];st.pinch={distance:Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y),midX:(points[0].x+points[1].x)/2,midY:(points[0].y+points[1].y)/2,zoom:st.zoom,panX:st.panX,panY:st.panY};st.gesture=true;st.draw=null;st.drag=null;return}
 sc.setPointerCapture(e.pointerId);const target=e.target.closest('[data-part3d],[data-window],[data-wall],[data-accessory],[data-module],[data-piece],[data-hit]');

  else if(winId){st.selectedPart=null;st.selectedAppliance=null;const win=st.room.windows.find(q=>q.id===winId);st.drag={kind:'window',id:winId,from:coord(e),value:win.x,side:win.side,changed:false};}
  else if(wallId){st.selectedPart=null;st.selectedAppliance=null;st.drag={kind:'wallPick',id:wallId,changed:false};}
  else
  if(accessoryId){st.selectedPart=null;const a=st.appliances.find(q=>q.id===accessoryId);st.selectedAppliance=accessoryId;st.moduleSelection=a?.moduleId||null;st.drag={kind:'equipment',id:accessoryId,from:coord(e),x:a.x,y:a.y,changed:false};}
  else if(id){st.selectedPart=null;st.selectedAppliance=null;st.moduleSelection=id;const m=st.modules.find(m=>m.id===id);st.drag={kind:'module',id,from:coord(e),x:m.x,scale:ambientUnits(),changed:false};}
  else{st.selectedPart=null;st.selectedAppliance=null;st.drag={kind:e.button===2||e.shiftKey||st.cameraPanMode?'pan':'orbit',from:coord(e),orbit:st.orbit,pitch:st.pitch,panX:st.panX,panY:st.panY,changed:false};}
  render();return
 }
const part=target?.getAttribute('data-piece');const bayId=target?.getAttribute('data-hit');let p=coord(e);let x=st.view==='top'?toTop(e):toFront(e);if(st.view==='top'){if(st.tool==='move')return;if(st.tool==='wall')st.draw={kind:'wall',from:x,temp:{x1:x.x,y1:x.y,x2:x.x,y2:x.y}};else st.draw={kind:'stone',from:x,temp:{x:x.x,y:x.y,w:0,d:0}};render();return}

function pointerMove(e){if(!st.pointers.has(e.pointerId))return;e.preventDefault();st.pointers.set(e.pointerId,coord(e));if(st.pointers.size===2&&st.pinch){const points=[...st.pointers.values()],distance=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);st.zoom=clamp(st.pinch.zoom*distance/Math.max(st.pinch.distance,1),.55,4);st.panX=st.pinch.panX+(points[0].x+points[1].x)/2-st.pinch.midX;st.panY=st.pinch.panY+(points[0].y+points[1].y)/2-st.pinch.midY;render();return}if(st.pointers.size!==1)return;let p=coord(e),x=st.view==='top'?toTop(e):toFront(e);if(st.drag){if(st.drag.kind==='orbit'){const dx=p.x-st.drag.from.x,dy=p.y-st.drag.from.y;if(Math.abs(dx)>2||Math.abs(dy)>2){st.orbit=st.drag.orbit+dx*.006;st.pitch=clamp(st.drag.pitch+dy*.003,.12,1.32);st.drag.changed=true;render()}return}if(st.drag.kind==='pan'){const dx=p.x-st.drag.from.x,dy=p.y-st.drag.from.y;st.panX=st.drag.panX+dx;st.panY=st.drag.panY+dy;st.drag.changed=true;render();return}if(st.drag.kind==='window'){const win=st.room.windows.find(w=>w.id===st.drag.id);if(!win)return;const dx=p.x-st.drag.from.x,dy=p.y-st.drag.from.y;const n=st.drag.value+(win.side==='back'?projectedX(dx,dy):projectedY(dx,dy));const limit=win.side==='back'?st.room.width:st.room.depth;const next=rd(clamp(n,0,limit-win.w));if(Math.abs(next-win.x)>.05&&validWindow({...win,x:next},win.id)){win.x=next;st.drag.changed=true;render()}return}
 if(st.drag.kind==='part3d'){const m=st.modules.find(q=>q.id===st.drag.moduleId);if(!m)return;const dx=p.x-st.drag.from.x,dy=p.y-st.drag.from.y;const next=rd(st.drag.value+(st.drag.part==='divider'?projectedX(dx,dy):projectedZ(dy)));if(st.drag.part==='divider'){const d=m.divs.find(q=>q.id===st.drag.id);const others=m.divs.filter(q=>q.id!==d?.id);if(d&&next>=3&&next<=m.base.w-m.th-3&&!others.some(q=>Math.abs(q.x-next)<m.th+3)){d.x=next;st.drag.changed=true;render();live('Divisória X',unit(d.x),'arrastando no 3D')}}else if(st.drag.part==='shelf'){const shelf=m.shelves.find(q=>q.id===st.drag.id);if(shelf){shelf.z=rd(clamp(next,m.th+2,m.height-m.railHeight-m.th-2));st.drag.changed=true;render();live('Prateleira altura',unit(shelf.z),'arrastando no 3D')}}else if(st.drag.part==='rail'){const rail=rd(clamp(st.drag.value-projectedZ(dy),2,Math.min(20,m.height-m.th-5)));if(rail!==m.railHeight){m.railHeight=rail;st.drag.changed=true;render();live('Régua',unit(rail),'arrastando no 3D')}}return}

function pointerUp(e){if(!st.pointers.has(e.pointerId))return;st.pointers.delete(e.pointerId);if(st.pointers.size>0)return;if(st.gesture){st.gesture=false;st.pinch=null;st.draw=null;st.drag=null;render();persist();return}let d=st.draw,g=st.drag;st.draw=null;st.drag=null;if(g?.kind==='wallPick'){wallEditor(g.id);render();return}if(g?.kind==='window'){if(g.changed){const prev=clone(st.room);const orig=prev.windows.find(w=>w.id===g.id);if(orig)orig.x=g.value;st.ambientHistory.push(JSON.stringify({modules:st.modules,appliances:st.appliances,room:prev}));persist()}else windowEditor(g.id);render();return}if(g?.kind==='part3d'){if(g.changed){const prev=clone(st.modules);const m=prev.find(m=>m.id===g.moduleId);if(m){const q=g.part==='divider'?m.divs.find(x=>x.id===g.id):g.part==='shelf'?m.shelves.find(x=>x.id===g.id):null;if(q){if(g.part==='divider')q.x=g.value;else q.z=g.value}else if(g.part==='rail')m.railHeight=g.value;}st.ambientHistory.push(JSON.stringify({modules:prev,appliances:st.appliances,room:st.room}));st.activeId=null;loadModule(g.moduleId);persist()}else part3dEditor();render();return}if(g?.kind==='orbit'||g?.kind==='pan'){if(g.changed)persist();render();return}if(g?.kind==='equipment'){if(g.changed){const old=clone(st.appliances);const row=old.find(a=>a.id===g.id);if(row){row.x=g.x;row.y=g.y}st.ambientHistory.push(JSON.stringify({modules:st.modules,appliances:old}));persist()}else{equipmentEditor()}render();return}if(g?.kind==='module'){if(g.changed){let m=st.modules.find(q=>q.id===g.id);let state=clone(st.modules);const old=state.find(q=>q.id===g.id);old.x=g.x;for(const peer of st.modules){if(peer.id!==m.id&&Math.abs(m.x-peer.x-peer.base.w)<2.5)m.x=rd(peer.x+peer.base.w)}st.ambientHistory.push(JSON.stringify(state));if(st.ambientHistory.length>30)st.ambientHistory.shift();persist()}render();return}if(d){if(d.kind==='stone'){if(d.temp.w>=20&&d.temp.d>=15)createStone(d.temp);else toast('Arraste o dedo mais longe, em diagonal.')}else if(d.kind==='wall'){if(Math.hypot(d.temp.x2-d.temp.x1,d.temp.y2-d.temp.y1)>5){checkpoint();st.walls.push(d.temp);render();persist()}}else if(d.kind==='divider'){if(divider(d.temp))toast('Lateral adicionada. Puxe para movimentar.');else render()}else if(d.kind==='shelf'){if(shelf(d.x,d.temp))toast('Prateleira adicionada. Puxe para movimentar.');else render()}else render()}
else if(g){if(g.kind==='tapbay'&&!g.changed){st.bay=g.bay;st.selected=null;render()}else if(g.changed){checkpointFromDrag(g);persist();st.divs.sort((a,b)=>a.x-b.x);render()}}else render()}
function checkpointFromDrag(g){/* save the PREVIOUS position so desfazer works after a drag */let previous=JSON.parse(snapshot());const index=g.kind==='divider'?3:4;const item=previous[index].find(it=>it.id===g.id);if(item){if(g.kind==='divider')item.x=g.value;else item.z=g.value}st.history.push(JSON.stringify(previous));if(st.history.length>35)st.history.shift()}

function saveSettings(){let num=id=>Number($(id).value),height=num('sHeight'),th=num('sTh'),offsetW=num('sOW'),offsetD=num('sOD');if(![height,th,offsetW,offsetD].every(Number.isFinite)||height<20||th<=0||offsetW<0||offsetD<0)return toast('Confira as medidas.');checkpoint();st.height=height;st.th=th;st.railHeight=clamp(num('sRail')||7,2,20);st.railRecess=clamp(num('sRec'),0,5);st.offsetW=offsetW;st.offsetD=offsetD;st.sheetL=num('sSL')||270;st.sheetW=num('sSW')||180;st.client=$('sClient').value;st.project=$('sProject').value;if(st.stone){const a=st.stone,bw=rd(a.w-st.offsetW),bd=rd(a.d-st.offsetD);if(bw>0&&bd>0)st.base={x:a.x+st.offsetW/2,y:a.y+st.offsetD/2,w:bw,d:bd,rail:true};st.divs=st.divs.filter(d=>d.x<st.base.w-st.th)}st.divs.forEach(d=>d.t=st.th);render();persist();closeSheet();toast('Medidas atualizadas!')}
