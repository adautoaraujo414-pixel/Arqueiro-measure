.drawarea{position:relative;flex:1;min-height:0;overflow:hidden}.drawarea svg{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}.drawarea text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;pointer-events:none}.drawarea [data-hit]{cursor:pointer}.drawarea [data-piece]{cursor:grab}.drawarea [data-piece]:active{cursor:grabbing}.floating-hint{position:absolute;top:13px;left:13px;right:13px;display:flex;justify-content:center;pointer-events:none;z-index:1}.floating-hint span{display:block;max-width:500px;background:#ffffffef;border:1px solid #ddebf1;box-shadow:0 4px 12px #1b35400d;padding:10px 15px;border-radius:11px;font-size:13px;text-align:center;color:#486777}.floating-hint b{color:#0b709d}.live{position:absolute;right:12px;bottom:12px;background:#fff;border:1px solid #dbe7ee;border-radius:11px;padding:8px 13px;min-width:132px;pointer-events:none;box-shadow:0 5px 16px #173d5112}.live small{display:block;font-size:10px;color:#6c8590}.live b{font-size:21px;color:var(--blue);font-variant-numeric:tabular-nums}.zooms{position:absolute;left:12px;bottom:14px;display:flex;align-items:center;gap:5px;z-index:1}.zooms button{background:#fff;border:1px solid #d7e4eb;width:39px;height:39px;border-radius:11px;font-weight:750;font-size:20px;box-shadow:0 3px 10px #12405812}.zooms .fit{font-size:13px;width:53px}

</style></head><body>
<header class="header"><div class="logo">A</div><div class="brand"><b>ARQUE <span>MOB</span></b><small>Construa. Ajuste. Produza.</small></div><span class="chip">Ambiente + Construtor • versão de testes 0.6</span><div class="grow"></div><button class="iconbtn" id="backMeasure" title="Voltar ao Arque Measure" aria-label="Voltar ao Arque Measure">⌂</button><button class="iconbtn" id="undo" title="Desfazer" aria-label="Desfazer">↶</button><button class="iconbtn" id="options" title="Medidas e configurações" aria-label="Medidas e configurações">⚙</button><button class="iconbtn" id="pieces" title="Peças e plano de corte" aria-label="Peças e plano de corte">▤</button></header>
<div class="shell"><nav class="tools" aria-label="Ferramentas"><button class="tool active" data-tool="draw"><i>✎</i>Desenhar</button><button class="tool" data-tool="move"><i>↔</i>Mover</button><button class="tool" data-tool="stone"><i>▱</i>Pedra</button><button class="tool" data-tool="wall"><i>╱</i>Parede</button><button class="tool" data-tool="divider"><i>▯</i>Lateral</button><button class="tool" data-tool="shelf"><i>═</i>Prateleira</button><div class="space"></div><button class="tool" id="newProject"><i>＋</i>Novo</button></nav>
<main class="workspace"><div class="stagehead"><div class="steps" id="steps"><strong>1.</strong> Desenhe a pedra</div><div class="views"><button data-view="ambient" class="on">Ambiente</button><button data-view="top">Planta</button><button data-view="front">Frente</button><button data-view="iso">3D</button></div></div>
<div class="drawarea"><svg id="scene" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" aria-label="Desenhe com o dedo. Veja as medidas aparecerem ao vivo."></svg><div class="floating-hint"><span id="hint">✎ <b>Puxe o dedo em diagonal</b> para desenhar sua pedra</span></div><div class="zooms"><button id="zoomOut" title="Diminuir">−</button><button class="fit" id="fit" title="Centralizar">100%</button><button id="zoomIn" title="Ampliar">+</button></div><div class="live"><small id="liveTitle">Medindo agora</small><b id="liveMeasure">—</b><small id="liveSubtitle">arraste uma peça</small></div></div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),SV='http://www.w3.org/2000/svg',sc=$('scene');
const clamp=(n,a,b)=>Math.max(a,Math.min(n,b)),rd=n=>Math.round(n*10)/10,fmt=n=>rd(n).toLocaleString('pt-BR',{maximumFractionDigits:1}),unit=n=>`${fmt(n)} cm`;
const linkedParams=new URLSearchParams(location.search);
const linkedProject=linkedParams.get('project');
const linkedRoom=linkedParams.get('room')||'principal';
const saveKey=linkedProject?'arque-mob-v06:'+linkedProject+':'+linkedRoom:'arque-mob-v05';
let linkedWrite=Promise.resolve();
function linkedDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('arque_measure_local',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('store'))req.result.createObjectStore('store')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveToMeasure(json){if(!linkedProject)return;const db=await linkedDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction('store','readwrite'),store=tx.objectStore('store');const q=store.get('state');q.onsuccess=()=>{const state=q.result;if(!state?.projects)return;const project=state.projects.find(x=>x.id===linkedProject);if(!project)return;if(!project.arqueMobByRoom)project.arqueMobByRoom={};project.arqueMobByRoom[linkedRoom]=JSON.parse(json);store.put(state,'state')};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function loadFromMeasure(){if(!linkedProject)return;try{const db=await linkedDb();const state=await new Promise((resolve,reject)=>{const tx=db.transaction('store','readonly');const r=tx.objectStore('store').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();const project=state?.projects?.find(p=>p.id===linkedProject);if(!project)return;const data=project.arqueMobByRoom?.[linkedRoom];if(data){restoreMob(data);persist();render()}else if(!st.modules.length){st.client=state.clients?.find(x=>x.id===project.clientId)?.name||st.client;st.project=project.name+(project.rooms?.find(x=>x.id===linkedRoom)?.name?' / '+project.rooms.find(x=>x.id===linkedRoom).name:'');render()}}catch(e){console.warn('Arque Mob: não foi possível recuperar dados do projeto',e)}}
function restoreMob(saved){if(!saved||!Array.isArray(saved.modules))return;['stone','base','walls','divs','shelves','fills','th','height','seq','client','project','sheetL','sheetW','offsetW','offsetD','railHeight','railRecess','modules','activeId','moduleSelection','moduleSeq'].forEach(k=>{if(saved[k]!==undefined)st[k]=saved[k]});st.view=st.modules.length?'ambient':'front'}
const st={view:'ambient',tool:'draw',stone:null,base:null,walls:[],divs:[],shelves:[],fills:{},th:1.5,height:77,sheetL:270,sheetW:180,offsetW:7,offsetD:4,railHeight:7,railRecess:1.5,modules:[],activeId:null,moduleSelection:null,moduleSeq:1,gesture:false,pinch:null,ambientHistory:[],client:'Cliente demonstração',project:'Cozinha',seq:1,selected:null,bay:null,draw:null,drag:null,zoom:1,pointers:new Map(),history:[]};
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const R=(x,y,w,h,fill='#fff',stroke='#b2c9d5',extra='')=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" rx="2" fill="${fill}" stroke="${stroke}" ${extra}/>`;
const L=(x,y,X,Y,color='#bbd0da',sw=1,extra='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${color}" stroke-width="${sw}" ${extra}/>`;
const T=(x,y,s,sz=16,color='#486273',anchor='middle',extra='')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${sz}" fill="${color}" ${extra}>${escapeHtml(s)}</text>`;
function snapshot(){return JSON.stringify(['stone','base','walls','divs','shelves','fills','seq','railHeight','railRecess'].map(k=>st[k]))}
function checkpoint(){st.history.push(snapshot());if(st.history.length>35)st.history.shift()}
function undo(){if(st.view==='ambient'&&st.ambientHistory.length){st.modules=JSON.parse(st.ambientHistory.pop());st.moduleSelection=null;st.activeId=null;if(st.modules.length)loadModule(st.modules[0].id);st.view='ambient';render();persist();return}
if(!st.history.length)return toast('Nada para desfazer.');const last=JSON.parse(st.history.pop());['stone','base','walls','divs','shelves','fills','seq','railHeight','railRecess'].forEach((k,i)=>{if(last[i]!==undefined)st[k]=last[i]});st.selected=null;st.bay=null;render();persist()}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2300)}
const moduleKeys=['stone','base','divs','shelves','fills','th','height','seq','railHeight','railRecess'];
const clone=o=>JSON.parse(JSON.stringify(o));
function syncCurrent(){if(!st.activeId)return;const m=st.modules.find(x=>x.id===st.activeId);if(!m)return;for(const k of moduleKeys)m[k]=clone(st[k])}
function loadModule(id){const m=st.modules.find(m=>m.id===id);if(!m)return false;syncCurrent();for(const k of moduleKeys)st[k]=clone(m[k]);st.activeId=id;st.moduleSelection=id;st.selected=null;st.bay=null;st.history=[];return true}
function ensureModule(){if(st.activeId||!st.base)return;const id='m'+st.moduleSeq++;st.activeId=id;st.moduleSelection=id;st.modules.push({id,label:'Armário '+(st.moduleSeq-1),x:0,...Object.fromEntries(moduleKeys.map(k=>[k,clone(st[k])]))})}
function ambientCheckpoint(){syncCurrent();st.ambientHistory.push(JSON.stringify(st.modules));if(st.ambientHistory.length>30)st.ambientHistory.shift()}
function persist(){try{ensureModule();syncCurrent();const json=JSON.stringify({version:'0.6',stone:st.stone,base:st.base,walls:st.walls,divs:st.divs,shelves:st.shelves,fills:st.fills,th:st.th,height:st.height,seq:st.seq,client:st.client,project:st.project,sheetL:st.sheetL,sheetW:st.sheetW,offsetW:st.offsetW,offsetD:st.offsetD,railHeight:st.railHeight,railRecess:st.railRecess,modules:st.modules,activeId:st.activeId,moduleSelection:st.moduleSelection,moduleSeq:st.moduleSeq});localStorage.setItem(saveKey,json);if(linkedProject)linkedWrite=linkedWrite.then(()=>saveToMeasure(json)).catch(e=>console.warn('Arque Mob: erro salvando projeto',e))}catch(e){}}
function allIsometric(){let o=grid();syncCurrent();const mods=st.modules.slice().sort((a,b)=>a.x-b.x);if(!mods.length)return o+T(500,280,'Comece um armário primeiro',24,'#63859b');
const maxX=Math.max(...mods.map(m=>m.x+m.base.w)),maxH=Math.max(...mods.map(m=>m.height));const scale=Math.min(2.65,670/Math.max(110,maxX),340/Math.max(60,maxH));const X=125,Y=491;
for(const m of mods){const x=X+m.x*scale,w=m.base.w*scale,h=m.height*scale,d=m.base.d*scale*.34,slope=m.base.d*scale*.22,top=Y-h,sel=m.id===st.moduleSelection;
let stroke=sel?'#1689be':'#8c9fa8',front=sel?'#f1faff':'#f7fafa';
o+=`<polygon points="${x},${top} ${x+d},${top-slope} ${x+w+d},${top-slope} ${x+w},${top}" fill="#d0b69b" stroke="${stroke}" stroke-width="2"/>`;
o+=`<polygon points="${x+w},${top} ${x+w+d},${top-slope} ${x+w+d},${Y-slope} ${x+w},${Y}" fill="#bfae9b" stroke="${stroke}" stroke-width="2"/>`;
o+=R(x,top,w,h,front,stroke,`stroke-width="${sel?3:1.6}"`);
o+=R(x,top,w,m.railHeight*scale,'#d6b991','#a38c68');o+=R(x,Y-m.th*scale,w,m.th*scale,'#b9a790','#968671');
for(const part of m.divs){const xx=x+part.x*scale;o+=R(xx,top+m.railHeight*scale,part.t*scale,(m.height-m.railHeight-m.th)*scale,'#ccb89e','#927c66')}
const ds=m.divs.slice().sort((a,b)=>a.x-b.x);const starts=[0,...ds.map(v=>v.x+v.t)],ends=[...ds.map(v=>v.x),m.base.w];for(let i=0;i<starts.length;i++){const filling=m.fills[i],bx=x+starts[i]*scale,bw=(ends[i]-starts[i])*scale,hh=(m.height-m.railHeight-m.th)*scale;
if(filling?.type==='doors')for(let j=0;j<filling.qty;j++)o+=R(bx+j*bw/filling.qty+2,top+m.railHeight*scale+2,bw/filling.qty-4,hh-4,'#ead9bfba','#baa384');
if(filling?.type==='drawers')for(let j=0;j<filling.qty;j++)o+=R(bx+3,top+m.railHeight*scale+j*hh/filling.qty+2,bw-6,hh/filling.qty-4,'#dbebec','#80a9b4');
if(filling?.type==='spice')o+=R(bx+bw*.28,top+(m.railHeight+7)*scale,bw*.44,hh-15*scale,'#cde9dc','#79a692')}
for(const sh of m.shelves){if(starts[sh.bay]!==undefined)o+=R(x+starts[sh.bay]*scale,Y-sh.z*scale,(ends[sh.bay]-starts[sh.bay])*scale,m.th*scale,'#a8d2d1','#719eaa')}
o+=R(x,top,w,h,'transparent','transparent',`data-module="${m.id}"`);
o+=T(x+w/2,Y+35,m.label,14,'#2b728f');
}
o+=T(500,605,'Ambiente 3D técnico • toque para selecionar • editar medidas em Propriedades',14,'#668897');return o}
function ambientMap(){syncCurrent();let mx=Math.max(200,...st.modules.map(m=>m.x+(m.base?.w||100)+15)),h=Math.max(80,...st.modules.map(m=>m.height||80));return {s:Math.min(3.15,805/mx,340/h),x:95,y:492}}
function ambientUnits(){const mods=st.modules;const maxX=Math.max(200,...mods.map(m=>m.x+(m.base?.w||0)));const maxH=Math.max(80,...mods.map(m=>m.height));return Math.min(2.65,670/Math.max(110,maxX),340/Math.max(60,maxH))}
function roomBackdrop(){
 let o=R(0,0,1000,640,'#f9f6ec','#f9f6ec');
 o+=`<polygon points="0,0 215,21 215,493 0,596" fill="#e5e1ee" stroke="#b6afc6" stroke-width="2"/>`;
 o+=`<polygon points="215,21 1000,21 1000,494 215,493" fill="#f5efcf" stroke="#d8d2b0" stroke-width="1"/>`;
 o+=`<polygon points="0,596 215,493 1000,494 1000,640 0,640" fill="#e7e5e4" stroke="#b4b2b0" stroke-width="2"/>`;
 o+=L(215,21,215,493,'#b4adbd',1.7);
 for(let t=0;t<=5;t++){const xx=215+(785/5)*t;o+=L(xx,493,xx+30,640,'#d8d5d2',.7)}
 o+=T(750,54,'AMBIENTE',14,'#9b967c');return o;
}
function ambient(){return roomBackdrop()+allIsometric().replace(grid(),'')}
function duplicateModule(){syncCurrent();const orig=st.modules.find(m=>m.id===(st.moduleSelection||st.activeId));if(!orig)return toast('Selecione um móvel.');ambientCheckpoint();const last=Math.max(...st.modules.map(m=>m.x+(m.base?.w||0)));const m=clone(orig);m.id='m'+st.moduleSeq++;m.label='Armário '+(st.modules.length+1);m.x=rd(Math.max(orig.x+orig.base.w,last));st.modules.push(m);st.moduleSelection=m.id;st.view='ambient';persist();render();toast('Móvel duplicado. Arraste para alinhar!')}

function modifyQty(delta){if(st.bay===null)return;let f=st.fills[st.bay];if(!f)return;let n=clamp(f.qty+delta,1,12);if(n===f.qty)return;checkpoint();f.qty=n;render();persist()}
function plan(src=st){let ls=[],add=(q,name,w,h,note='')=>{if(q>0&&w>0&&h>0)ls.push({q,name,w:rd(w),h:rd(h),note})};let b=src.base;if(!b)return ls;add(1,'Base',b.w,b.d);if(b.rail)add(1,'Régua superior contínua',b.w,src.railHeight,`Recuo frontal ${src.railRecess} cm; conferir acabamento cava 30°`);add(2,'Laterais externas',b.d,src.height-src.th,'Conferir rasgo da régua');add(src.divs.length,'Divisórias internas',b.d,src.height-src.th,'Conferir rasgo da régua');src.divs.forEach(()=>{});for(const sh of src.shelves){const v=boxesFor(src)[sh.bay];if(v)add(1,'Prateleira do vão '+(sh.bay+1),v.width,b.d-2)}for(const v of boxesFor(src)){const f=src.fills[v.index];if(!f)continue;if(f.type==='doors'){let w=(v.width+1.2)/f.qty,h=src.height-src.railHeight+2.5;add(f.qty,'Porta do vão '+(v.index+1),w,h,'Confirmar folgas/dobradiças')}
if(f.type==='drawers'){let n=f.qty,free=src.height-src.th-src.railHeight,usable=(free-(n-1)*5)/n,depth=Math.min(45,b.d-5),sideH=Math.max(0,usable-2),insideW=v.width-5.6;add(n-1,'Batentes cava de 5 cm',v.width,5);add(n*2,'Laterais da caixa',depth,sideH);add(n*2,'Contrafrente e traseira',insideW,Math.max(0,sideH-1));add(n,'Frentes de gaveta',v.width,Math.max(0,(src.height-4.5)/n),'Prévia: validar folga de 4 mm');}
if(f.type==='spice'){let depth=Math.min(45,b.d-5),w=v.width-2.6,h=src.height-src.th-src.railHeight;add(f.qty*2,'Porta-tempero bases 2 níveis',depth,w);add(f.qty*4,'Porta-tempero réguas 5 cm',depth,5);add(f.qty*2,'Porta-tempero frente/fundo',w,h-5,'Fita de borda em três lados')}}return ls}
function boxesFor(src){if(!src.base)return [];const ds=src.divs.slice().sort((a,b)=>a.x-b.x);let p=0;return [...ds,{x:src.base.w,t:0}].map((d,i)=>{const v={index:i,start:p,end:d.x,width:rd(Math.max(0,d.x-p))};p=d.x+d.t;return v})}
function planAll(){syncCurrent();return st.modules.length?st.modules.flatMap(m=>plan(m).map(p=>({...p,name:m.label+' · '+p.name}))):plan(st)}

function sheet(html){$('sheet').innerHTML=html;$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open')}
function showPieces(){const list=planAll(),long=list.filter(p=>Math.max(p.w,p.h)>st.sheetL||Math.min(p.w,p.h)>st.sheetW);sheet(`<div class="sheetrow"><h3 style="flex:1">Peças do projeto · ${list.reduce((s,p)=>s+p.q,0)} unidades</h3><button class="action" data-modal="close">Fechar ×</button></div><p>Prévia de produção. Confira folgas, acabamento e montagem antes de cortar.</p>${list.map(p=>`<div class="part"><div><strong>${p.q}×</strong> ${escapeHtml(p.name)}${p.note?`<div style="color:#718692;font-size:10px">${escapeHtml(p.note)}</div>`:''}</div><b>${unit(p.w)} × ${unit(p.h)}</b></div>`).join('')||'<p>Comece desenhando uma pedra.</p>'}<p>${long.length?'⚠ '+long.length+' tipo(s) de peça(s) excedem a chapa cadastrada. Divisão precisa ser avaliada.':'Chapa limite: '+unit(st.sheetL)+' × '+unit(st.sheetW)}</p><div class="sheetrow"><button class="action primary" data-modal="csv">⇩ Baixar lista CSV</button></div>`)}
function showSettings(){sheet(`<div class="sheetrow"><h3 style="flex:1">Medidas da sua marcenaria</h3><button class="action" data-modal="close">Fechar ×</button></div><p>Use o dedo para desenhar. Edite os números só quando precisar de medida exata.</p><div class="sheetrow"><label>Cliente<input id="sClient" value="${escapeHtml(st.client)}" style="width:180px"></label><label>Móvel<input id="sProject" value="${escapeHtml(st.project)}" style="width:180px"></label><label>Altura lateral (cm)<input type="number" id="sHeight" value="${st.height}"></label><label>Altura régua cava (cm)<input type="number" id="sRail" step="0.1" value="${st.railHeight}"></label><label>Recuo frontal (cm)<input type="number" id="sRec" step="0.1" value="${st.railRecess}"></label><label>MDF (cm)<input type="number" id="sTh" step="0.1" value="${st.th}"></label><label>Desconto da largura (cm)<input type="number" id="sOW" value="${st.offsetW}"></label><label>Recuo profundidade (cm)<input type="number" id="sOD" value="${st.offsetD}"></label><label>Chapa comprimento (cm)<input type="number" id="sSL" value="${st.sheetL}"></label><label>Chapa largura (cm)<input type="number" id="sSW" value="${st.sheetW}"></label></div><p>Padrões: régua e recuo configuráveis; cava 30°; para gavetas, descontar 5,6 cm na caixa; batentes de 5 cm; portas (vão + 1,2 cm).</p><div class="sheetrow"><button class="action primary" data-modal="set">Salvar medidas</button><button class="action" data-modal="json">Exportar projeto</button><button class="action" data-modal="clear">Novo projeto vazio</button></div>`)}
function showNumber(kind){const options=kind==='equal'?{title:'Quantos vãos iguais?',desc:'Exemplo: 3. As divisórias já entram na conta.',v:3}:kind==='pos'?{title:'Posição exata',desc:'Distância em centímetros, a partir da esquerda ou da base.',v:(st.divs.find(d=>d.id===st.selected)?.x||st.shelves.find(s=>s.id===st.selected)?.z||0)}:{title:'Quantidade',desc:'',v:1};sheet(`<div class="sheetrow"><h3 style="flex:1">${options.title}</h3><button class="action" data-modal="close">×</button></div><p>${options.desc}</p><div class="sheetrow"><input type="number" id="numberV" step="${kind==='equal'?1:0.1}" min="0" value="${options.v}"><button class="action primary" data-modal="number" data-kind="${kind}">Aplicar</button></div>`);$('numberV').focus()}
function sendFile(filename,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000)}
function handleAction(type){if(type==='sample'||type==='demo'){sample();toast('Exemplo pronto! Arraste as laterais com o dedo.')}else if(type==='equal')showNumber('equal');else if(type==='pieces')showPieces();else if(type==='empty'){checkpoint();st.modules=[];st.activeId=null;st.moduleSelection=null;st.moduleSeq=1;st.stone=null;st.base=null;st.divs=[];st.shelves=[];st.fills={};st.walls=[];st.view='top';st.tool='draw';st.bay=null;st.selected=null;render();persist()}
else if(type==='moduleEdit'){startEditSelected()}else if(type==='moduleDuplicate'){duplicateModule()}else if(type==='moduleProps'){moduleEditor()}else if(type==='close'){st.bay=null;st.selected=null;render()}else if(type==='clearbay'){checkpoint();delete st.fills[st.bay];st.shelves=st.shelves.filter(s=>s.bay!==st.bay);render();persist()}else if(type==='fewer')modifyQty(-1);else if(type==='more')modifyQty(1);
else if(type==='remove'){checkpoint();st.divs=st.divs.filter(d=>d.id!==st.selected);st.shelves=st.shelves.filter(s=>s.id!==st.selected);st.fills={};st.selected=null;st.bay=null;render();persist()}
else if(type==='copy'){const d=st.divs.find(i=>i.id===st.selected);const sh=st.shelves.find(i=>i.id===st.selected);if(d){if(divider(d.x+12))toast('Lateral duplicada')}else if(sh){if(shelf((boxes()[sh.bay].start+boxes()[sh.bay].end)/2,sh.z+10))toast('Prateleira duplicada')}}else if(type==='selectpos')showNumber('pos');else if(type==='help')sheet(`<div class="sheetrow"><h3 style="flex:1">Como construir em 3 passos</h3><button class="action" data-modal="close">×</button></div><p><b>1.</b> Na Planta, arraste em diagonal para desenhar a pedra. A base respeita automaticamente os descontos de 7 cm na largura e 4 cm na profundidade.</p><p><b>2.</b> Na Frente, faça um risco de cima para baixo para criar uma lateral. Risco na horizontal cria prateleira. Puxe a lateral com o dedo para mudar o tamanho dos vãos.</p><p><b>3.</b> Toque em qualquer vão e escolha portas, gavetas ou porta-temperos. O plano de corte vai sendo calculado. Toque em 3D para visualizar.</p><button class="action primary" data-modal="close">Entendi</button>`)}
function pointerDown(e){e.preventDefault();st.pointers.set(e.pointerId,coord(e));if(st.pointers.size>1){const points=[...st.pointers.values()];st.pinch={distance:Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y),zoom:st.zoom};st.gesture=true;st.draw=null;st.drag=null;return}sc.setPointerCapture(e.pointerId);const target=e.target.closest('[data-module],[data-piece],[data-hit]');if(st.view==='ambient'||st.view==='iso'&&st.modules.length>1){const id=target?.getAttribute('data-module');if(id){st.moduleSelection=id;const m=st.modules.find(m=>m.id===id);if(st.view==='ambient')st.drag={kind:'module',id,from:coord(e),x:m.x,scale:ambientUnits(),changed:false};}else st.moduleSelection=null;render();return}const part=target?.getAttribute('data-piece');const bayId=target?.getAttribute('data-hit');let p=coord(e);let x=st.view==='top'?toTop(e):toFront(e);if(st.view==='top'){if(st.tool==='move')return;if(st.tool==='wall')st.draw={kind:'wall',from:x,temp:{x1:x.x,y1:x.y,x2:x.x,y2:x.y}};else st.draw={kind:'stone',from:x,temp:{x:x.x,y:x.y,w:0,d:0}};render();return}
if(st.view==='iso'){if(bayId!==undefined&&bayId!==null){st.bay=Number(bayId);st.selected=null;render()}return}
if(part && part!=='base' && st.tool!=='divider' && st.tool!=='shelf'){const d=st.divs.find(d=>d.id===part),sh=st.shelves.find(s=>s.id===part);if(d||sh){st.selected=part;st.bay=null;st.drag={id:part,kind:d?'divider':'shelf',start:x,value:d?.x??sh.z,changed:false};render();return}}
if((st.tool==='move'||st.tool==='draw')&&bayId!==undefined&&bayId!==null){st.drag={kind:'tapbay',bay:Number(bayId),from:p,changed:false};return}
if(!st.base)return;if(st.tool==='shelf')st.draw={kind:'shelf',start:p,bay:getBay(x.x)?.index,temp:x.z,x:x.x};else if(st.tool==='divider')st.draw={kind:'divider',start:p,temp:x.x};else if(st.tool==='draw'){st.draw={kind:'line',start:p,last:p,from:x};}}
function pointerMove(e){if(!st.pointers.has(e.pointerId))return;e.preventDefault();st.pointers.set(e.pointerId,coord(e));if(st.pointers.size===2&&st.pinch){const points=[...st.pointers.values()],distance=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);st.zoom=clamp(st.pinch.zoom*distance/Math.max(st.pinch.distance,1),.8,3.2);render();return}if(st.pointers.size!==1)return;let p=coord(e),x=st.view==='top'?toTop(e):toFront(e);if(st.drag){if(st.drag.kind==='module'){const m=st.modules.find(q=>q.id===st.drag.id);if(m){const next=rd(Math.max(0,st.drag.x+(p.x-st.drag.from.x)/st.drag.scale));if(Math.abs(m.x-next)>.05){m.x=next;st.drag.changed=true;render();live('Posição do móvel',unit(m.x),'arraste para alinhar')}}return}if(st.drag.kind==='tapbay'){if(Math.hypot(p.x-st.drag.from.x,p.y-st.drag.from.y)>16){const prev=st.drag;st.drag=null;st.draw={kind:'line',start:prev.from,last:p,from:toFront({clientX:e.clientX-(p.x-prev.from.x),clientY:e.clientY-(p.y-prev.from.y)})};}return}if(st.drag.kind==='divider'){const d=st.divs.find(d=>d.id===st.drag.id);if(!d)return;const others=st.divs.filter(v=>v.id!==d.id).sort((a,b)=>a.x-b.x),prev=others.filter(v=>v.x<d.x).slice(-1)[0],next=others.find(v=>v.x>d.x);let fromX=st.drag.start.x,move=x.x-fromX,v=clamp(st.drag.value+move,prev?prev.x+st.th+5:5,next?next.x-st.th-5:st.base.w-st.th-5);d.x=rd(v);st.drag.changed=true;live('Posição da lateral',unit(d.x),'arrastando...');render();live('Posição da lateral',unit(d.x),'arrastando...');return}
if(st.drag.kind==='shelf'){const sh=st.shelves.find(i=>i.id===st.drag.id);if(!sh)return;sh.z=rd(clamp(st.drag.value+x.z-st.drag.start.z,st.th+4,st.height-st.railHeight-st.th));st.drag.changed=true;render();live('Altura da prateleira',unit(sh.z),'arrastando...');return}}
if(!st.draw)return;if(st.draw.kind==='stone'){const a=st.draw.from;st.draw.temp={x:rd(Math.min(a.x,x.x)),y:rd(Math.min(a.y,x.y)),w:rd(Math.abs(a.x-x.x)),d:rd(Math.abs(a.y-x.y))};render();live('Pedra agora',`${unit(st.draw.temp.w)} × ${unit(st.draw.temp.d)}`,'solte para criar a base');return}
if(st.draw.kind==='wall'){const f=st.draw.from,dx=x.x-f.x,dy=x.y-f.y;st.draw.temp={x1:f.x,y1:f.y,x2:Math.abs(dx)>Math.abs(dy)?x.x:f.x,y2:Math.abs(dx)<=Math.abs(dy)?x.y:f.y};render();live('Parede agora',unit(Math.hypot(dx,dy)),'alinhamento automático');return}
if(st.draw.kind==='divider'){st.draw.temp=x.x;render();live('Posição da lateral',unit(x.x),'solte para adicionar');return}
if(st.draw.kind==='shelf'){st.draw.temp=x.z;render();live('Altura da prateleira',unit(x.z),'solte para adicionar');return}
if(st.draw.kind==='line'){st.draw.last=p;let dx=p.x-st.draw.start.x,dy=p.y-st.draw.start.y;if(Math.abs(dy)>Math.abs(dx)*1.1){st.draw.kind='divider';st.draw.temp=x.x}else if(Math.abs(dx)>Math.abs(dy)*1.1){st.draw.kind='shelf';st.draw.temp=x.z;st.draw.bay=getBay(st.draw.from.x)?.index;st.draw.x=st.draw.from.x}render();live('Criando peça',st.draw.kind==='divider'?unit(x.x):unit(x.z),'solte para posicionar')}
}
function pointerUp(e){if(!st.pointers.has(e.pointerId))return;st.pointers.delete(e.pointerId);if(st.pointers.size>0)return;if(st.gesture){st.gesture=false;st.pinch=null;st.draw=null;st.drag=null;render();return}let d=st.draw,g=st.drag;st.draw=null;st.drag=null;if(g?.kind==='module'){if(g.changed){let m=st.modules.find(q=>q.id===g.id);let state=clone(st.modules);const old=state.find(q=>q.id===g.id);old.x=g.x;for(const peer of st.modules){if(peer.id!==m.id&&Math.abs(m.x-peer.x-peer.base.w)<2.5)m.x=rd(peer.x+peer.base.w)}st.ambientHistory.push(JSON.stringify(state));if(st.ambientHistory.length>30)st.ambientHistory.shift();persist()}render();return}if(d){if(d.kind==='stone'){if(d.temp.w>=20&&d.temp.d>=15)createStone(d.temp);else toast('Arraste o dedo mais longe, em diagonal.')}else if(d.kind==='wall'){if(Math.hypot(d.temp.x2-d.temp.x1,d.temp.y2-d.temp.y1)>5){checkpoint();st.walls.push(d.temp);render();persist()}}else if(d.kind==='divider'){if(divider(d.temp))toast('Lateral adicionada. Puxe para movimentar.');else render()}else if(d.kind==='shelf'){if(shelf(d.x,d.temp))toast('Prateleira adicionada. Puxe para movimentar.');else render()}else render()}
else if(g){if(g.kind==='tapbay'&&!g.changed){st.bay=g.bay;st.selected=null;render()}else if(g.changed){checkpointFromDrag(g);persist();st.divs.sort((a,b)=>a.x-b.x);render()}}else render()}
function checkpointFromDrag(g){/* save the PREVIOUS position so desfazer works after a drag */let previous=JSON.parse(snapshot());const index=g.kind==='divider'?3:4;const item=previous[index].find(it=>it.id===g.id);if(item){if(g.kind==='divider')item.x=g.value;else item.z=g.value}st.history.push(JSON.stringify(previous));if(st.history.length>35)st.history.shift()}
function setView(v){if(v==='ambient')syncCurrent();st.view=v;st.tool='draw';st.selected=null;st.bay=null;closeSheet();render()}
function setTool(t){st.tool=t;if(t==='draw'&&st.view==='ambient')st.view='top';if(t==='stone'||t==='wall')st.view='top';if(t==='divider'||t==='shelf')st.view='front';st.selected=null;st.bay=null;closeSheet();render()}
function saveSettings(){let num=id=>Number($(id).value),height=num('sHeight'),th=num('sTh'),offsetW=num('sOW'),offsetD=num('sOD');if(![height,th,offsetW,offsetD].every(Number.isFinite)||height<20||th<=0||offsetW<0||offsetD<0)return toast('Confira as medidas.');checkpoint();st.height=height;st.th=th;st.railHeight=clamp(num('sRail')||7,2,20);st.railRecess=clamp(num('sRec'),0,5);st.offsetW=offsetW;st.offsetD=offsetD;st.sheetL=num('sSL')||270;st.sheetW=num('sSW')||180;st.client=$('sClient').value;st.project=$('sProject').value;if(st.stone){const a=st.stone,bw=rd(a.w-st.offsetW),bd=rd(a.d-st.offsetD);if(bw>0&&bd>0)st.base={x:a.x+st.offsetW/2,y:a.y+st.offsetD/2,w:bw,d:bd,rail:true};st.divs=st.divs.filter(d=>d.x<st.base.w-st.th)}st.divs.forEach(d=>d.t=st.th);render();persist();closeSheet();toast('Medidas atualizadas!')}
function modalClick(e){const b=e.target.closest('[data-modal]');if(!b)return;const t=b.dataset.modal;if(t==='close')closeSheet();else if(t==='csv'){const ls=planAll();sendFile('Arque-Mob-Corte-v05-PREVIA.csv','\ufeffQuantidade;Peça;Largura cm;Altura ou Profundidade cm;Observações\n'+ls.map(a=>[a.q,a.name,a.w,a.h,a.note].map(x=>String(x).replaceAll(';',',')).join(';')).join('\n'),'text/csv;charset=utf-8');}
else if(t==='moduleSave')saveModuleEditor();else if(t==='moduleEdit')startEditSelected();else if(t==='moduleDuplicate'){duplicateModule();closeSheet()}else if(t==='moduleDelete')deleteSelectedModule();else if(t==='json')sendFile('Arque-Mob-Projeto-v05.json',JSON.stringify({version:'0.5',modules:(syncCurrent(),st.modules),date:new Date().toISOString(),client:st.client,project:st.project,stone:st.stone,base:st.base,walls:st.walls,divs:st.divs,shelves:st.shelves,fills:st.fills},null,2),'application/json');else if(t==='set')saveSettings();else if(t==='clear'){checkpoint();st.modules=[];st.activeId=null;st.moduleSelection=null;Object.assign(st,{stone:null,base:null,divs:[],shelves:[],fills:{},walls:[],view:'top',tool:'draw',selected:null,bay:null});closeSheet();render();persist()}
else if(t==='number'){let n=Number($('numberV').value);if(b.dataset.kind==='equal')divide(Math.round(n));else {const part=st.divs.find(d=>d.id===st.selected)||st.shelves.find(s=>s.id===st.selected);if(part){checkpoint();if('x'in part)part.x=rd(clamp(n,3,st.base.w-st.th-3));else part.z=rd(clamp(n,st.th+3,st.height-st.railHeight-st.th));persist();render()}}closeSheet()}}
sc.addEventListener('pointerdown',pointerDown);sc.addEventListener('pointermove',pointerMove);sc.addEventListener('pointerup',pointerUp);sc.addEventListener('pointercancel',pointerUp);
sc.addEventListener('dblclick',e=>{if(st.view==='ambient'&&e.target.closest('[data-module]')){st.moduleSelection=e.target.closest('[data-module]').getAttribute('data-module');startEditSelected()}});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'');if(typing)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateModule()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if(e.key==='Escape')closeSheet()});
sc.addEventListener('wheel',e=>{e.preventDefault();st.zoom=clamp(st.zoom*(e.deltaY<0?1.1:.9),.8,2.4);render()},{passive:false});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
$('actionstrip').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)handleAction(b.dataset.action);if(b.dataset.fill)fill(b.dataset.fill)});$('sheet').addEventListener('click',modalClick);$('undo').onclick=undo;$('options').onclick=showSettings;$('pieces').onclick=showPieces;$('newProject').onclick=()=>handleAction('empty');$('zoomIn').onclick=()=>{st.zoom=clamp(st.zoom*1.2,.8,2.4);render()};$('zoomOut').onclick=()=>{st.zoom=clamp(st.zoom/1.2,.8,2.4);render()};$('fit').onclick=()=>{st.zoom=1;render()};
try{const saved=JSON.parse(localStorage.getItem(saveKey)||(linkedProject?'null':localStorage.getItem('arque-mob-v04'))||'null');if(saved&&(saved.stone||saved.modules?.length)){['stone','base','walls','divs','shelves','fills','th','height','seq','client','project','sheetL','sheetW','offsetW','offsetD','railHeight','railRecess','modules','activeId','moduleSelection','moduleSeq'].forEach(k=>{if(saved[k]!==undefined)st[k]=saved[k]});st.view=st.modules.length?'ambient':'front';if(!st.modules.length)ensureModule()}}catch(err){}render();loadFromMeasure();
$('backMeasure').onclick=()=>{location.href='index.html'};window.ArqueAppBack=()=>{location.href='index.html';return true};
})();
