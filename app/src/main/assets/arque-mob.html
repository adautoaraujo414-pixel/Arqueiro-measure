 if(!Number.isFinite(x)||!Number.isFinite(w)||x<0||x+w>st.room.width+.001)return false;
 return !st.modules.some(m=>m.base&&m.id!==exclude&&x<m.x+m.base.w-.01&&x+w>m.x+.01)&&
 !st.appliances.some(a=>a.type==='fridge'&&x<a.x+a.w-.01&&x+w>a.x+.01);
}
function validModuleWidth(m,w){
 if(!m?.base||!Number.isFinite(w)||w<20||w>st.room.width||!usableModulePosition(m.x,w,m.id))return false;
 if(m.divs.some(d=>d.x<3||d.x+d.t+5>w))return false;
 if(st.appliances.some(a=>a.moduleId===m.id&&a.x+a.w>w))return false;
 return true;
}
function snappedModulePosition(x,m){
 const joins=[0,st.room.width-m.base.w];
 for(const q of st.modules)if(q.id!==m.id&&q.base){joins.push(q.x+q.base.w,q.x-m.base.w)}
 for(const q of st.appliances)if(q.type==='fridge')joins.push(q.x+q.w,q.x-m.base.w);
 const nearest=joins.filter(v=>Math.abs(v-x)<=3).sort((a,b)=>Math.abs(a-x)-Math.abs(b-x));
 for(const value of [...nearest,x])if(usableModulePosition(value,m.base.w,m.id))return rd(value);
 return m.x;
}
function withinApplianceSpace(a,x,y,w=a.w,d=a.d){
 const m=st.modules.find(q=>q.id===a.moduleId);
 if(a.type==='fridge')return x>=0&&y>=0&&x+w<=st.room.width&&y+d<=st.room.depth&&a.h<=st.room.height&&
 !st.modules.some(k=>k.base&&x<k.x+k.base.w&&x+w>k.x&&y<k.base.d&&y+d>0);
 if(!m||x<0||y<0||x+w>m.base.w||y+d>m.base.d)return false;
 if(['oven','microwave'].includes(a.type)&&((a.z||0)<m.th+1||(a.z||0)+(a.depth||30)>m.height-m.railHeight-1))return false;
 if(['oven','microwave'].includes(a.type)&&st.appliances.some(q=>q.id!==a.id&&q.moduleId===m.id&&['oven','microwave'].includes(q.type)&&x<q.x+q.w&&x+w>q.x&&y<q.y+q.d&&y+d>q.y&&(a.z||0)<(q.z||0)+(q.depth||0)&&(a.z||0)+(a.depth||0)>q.z))return false;
 return !st.appliances.some(q=>q.id!==a.id&&q.moduleId===m.id&&['sink','cooktop'].includes(q.type)&&['sink','cooktop'].includes(a.type)&&x<q.x+q.w&&x+w>q.x&&y<q.y+q.d&&y+d>q.y);
}

 const m=activeModule();if(!['sink','fridge','cooktop','oven','microwave'].includes(type))return toast('Equipamento inválido.');if(type!=='fridge'&&!m)return toast('Crie ou selecione um móvel para inserir o equipamento.');

 }else{
  const defaults={sink:{w:50,d:40,depth:19,label:'Cuba'},cooktop:{w:60,d:52,depth:5,label:'Cooktop'},oven:{w:59.5,d:50,depth:59.5,z:5,label:'Forno'},microwave:{w:48,d:38,depth:30,z:35,label:'Micro-ondas'}}[type];if(!defaults){st.ambientHistory.pop();return toast('Equipamento desconhecido.');}
  const gap=(type==='sink'||type==='cooktop')?2:3;if(m.base.w<defaults.w+2*gap||m.base.d<defaults.d+2*gap){toast('Este armário é pequeno para o equipamento. Ajuste as dimensões primeiro.');st.ambientHistory.pop();return}

 }
 if(!withinApplianceSpace(a,a.x,a.y)){st.ambientHistory.pop();return toast('Espaço ocupado ou fora do ambiente.');}st.appliances.push(a);st.selectedAppliance=id;st.moduleSelection=null;st.view='ambient';closeSheet();render();persist();equipmentEditor();toast('Equipamento inserido. Edite as medidas e posição.');

  if(!Number.isInteger(p.q)||p.q<=0||p.q>3000||!Number.isFinite(p.w)||!Number.isFinite(p.h)||p.w<=0||p.h<=0){unfit.push({name:p.name,reason:'Dimensão ou quantidade inválida'});continue;}

function validWindow(v,except=null){const r=st.room,limit=v.side==='back'?r.width:r.depth;
 return ['back','left'].includes(v.side)&&[v.x,v.w,v.z,v.h].every(Number.isFinite)&&v.x>=0&&v.w>=20&&v.z>=0&&v.h>=20&&v.x+v.w<=limit&&v.z+v.h<=r.height&&!r.windows.some(q=>q.id!==except&&q.side===v.side&&v.x<q.x+q.w&&v.x+v.w>q.x&&v.z<q.z+q.h&&v.z+v.h>q.z);

 if(![w,d,h].every(Number.isFinite)||w<100||w>3000||d<100||d>3000||h<160||h>700)return toast('Confira as medidas do ambiente.');
 if(st.modules.some(m=>m.base&&(m.x+m.base.w>w||m.height>h||m.base.d>d))||st.appliances.some(a=>a.type==='fridge'&&(a.x+a.w>w||a.h>h)))return toast('Há móvel ou geladeira maior que o espaço. Reposicione antes de reduzir o cômodo.');
 if(st.appliances.some(a=>a.type==='fridge'&&(a.y+a.d>d||a.h>h)))return toast('Geladeira excede o ambiente; reposicione-a antes.');
 if(r.windows.some(v=>v.x+v.w>(v.side==='back'?w:d)||v.z+v.h>h)||r.walls.some(v=>Math.max(v.x1,v.x2)>w||Math.max(v.y1,v.y2)>d||v.h>h))return toast('Uma janela ou parede não cabe nas novas medidas. Edite antes de reduzir.');
 ambientCheckpoint();Object.assign(r,{width:rd(w),depth:rd(d),height:rd(h)});closeSheet();render();persist();toast('Ambiente atualizado, móveis na escala original.');}

function savePart3d(){const p=st.selectedPart,m=st.modules.find(q=>q.id===p?.moduleId);if(!m)return;let k=p.kind,val;
 if(k==='divider'){val=Number($('p3X')?.value);const d=m.divs.find(x=>x.id===p.id);const others=m.divs.filter(q=>q.id!==p.id);if(!d||!Number.isFinite(val)||val<3||val>m.base.w-m.th-3||others.some(q=>Math.abs(q.x-val)<m.th+3))return toast('Posição de divisória inválida ou sobreposta.');ambientCheckpoint();d.x=rd(val);m.divs.sort((a,b)=>a.x-b.x);}
