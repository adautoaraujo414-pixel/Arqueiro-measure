name: Arquemestre
options:
  bundleIdPrefix: br.com.arque
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  Arquemestre:
    type: application
    platform: iOS
    sources:
      - path: Arquemestre
        excludes:
          - "Resources/Info.plist"
          - "Resources/Arquemestre.storekit"
      # o mesmo editor de móveis do Android (um arquivo só para os dois apps)
      - path: ../app/src/main/assets/editor.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.arque.measure
        PRODUCT_NAME: Arquemestre
        INFOPLIST_FILE: Arquemestre/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  ArquemestreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArquemestreTests
    dependencies:
      - target: Arquemestre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.arque.measure.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Arquemestre.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Arquemestre"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Arquemestre:
    build:
      targets:
        Arquemestre: all
        ArquemestreTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Arquemestre/Resources/Arquemestre.storekit
    test:
      config: Debug
      targets:
        - ArquemestreTests
    archive:
      config: Release
