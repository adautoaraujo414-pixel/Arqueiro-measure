<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AQRender · prova isolada (fase 2)</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#15181d;color:#e8eaee;font:14px system-ui,sans-serif}canvas{display:block}#inf{padding:8px 12px;white-space:pre-wrap}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="aq"></canvas>
<div id="inf">carregando a cena…</div>
<script type="module">
/* AQRender · prova isolada (fase 2). Fica FORA do editor: lê a cópia congelada da cena (saida/cena.json) e desenha com luz,
   sombra e reflexo. Cada caixa/prisma da cópia vira um objeto, um por um, sem interpretar nem completar nada.
   No fim confere peça por peça (quantidade e medidas) e só então libera a imagem. */
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const Q = new URLSearchParams(location.search), K = Math.max(.25, +Q.get('k') || 1), MODO = Q.get('modo') || 'realista';
const cena = await (await fetch(Q.get('cena') || 'saida/cena.json')).json();
const t0 = performance.now();
/* o 3D do editor conta a profundidade ao contrário do que a biblioteca espera (mão esquerda × mão direita). Se for o caso, a cópia
   é espelhada na profundidade junto com a câmera: a imagem na tela fica idêntica e as medidas não mudam (só o sinal de uma coordenada). */
{ const c = cena.cam, d3 = c.X[0] * (c.Y[1] * c.W[2] - c.Y[2] * c.W[1]) - c.X[1] * (c.Y[0] * c.W[2] - c.Y[2] * c.W[0]) + c.X[2] * (c.Y[0] * c.W[1] - c.Y[1] * c.W[0]);
  cena.espelhada = d3 > 0;
  if (cena.espelhada) { c.X[2] = -c.X[2]; c.Y[2] = -c.Y[2]; c.W[2] = -c.W[2];
    for (const b of cena.boxes.concat(cena.bg)) { const z0 = b.z0; b.z0 = -b.z1; b.z1 = -z0;
      if (b.poly) b.poly = b.poly.map(q => [-q[0], q[1]]);
      if (b.pf && b.pf.ax === 'x') b.pf.pts = b.pf.pts.map(q => [-q[0], q[1]]);
      if (b.pf && b.pf.ax === 'y') b.pf.pts = b.pf.pts.map(q => [q[0], -q[1]]);
      if (b.gp) b.gp = { a: b.gp.a.map(q => [q[0], q[1], -q[2]]), d: [b.gp.d[0], b.gp.d[1], -b.gp.d[2]] }; } } }

/* ---------- 1. inventário da cópia (antes) ---------- */
const TEC = b => b.g === 'sh' || b.g === 'lo';              /* sombra pintada e contorno do 3D do editor: truque de desenho, não é peça */
const fonte = [];
cena.boxes.forEach((b, i) => fonte.push({ id: 'm' + i, b, amb: false }));
cena.bg.forEach((b, i) => fonte.push({ id: 'a' + i, b, amb: true }));
/* o olho da câmera sai das mesmas linhas da projeção que o editor usa na tela */
const X = cena.cam.X, Y = cena.cam.Y, Wr = cena.cam.W;
const A3 = new THREE.Matrix3().set(X[0], X[1], X[2], Y[0], Y[1], Y[2], Wr[0], Wr[1], Wr[2]);
const olho = new THREE.Vector3(-X[3], -Y[3], -Wr[3]).applyMatrix3(A3.clone().invert());
/* parede entre a câmera e os móveis: o 3D do editor esconde pra dar pra ver por dentro; aqui some igual (mesma regra, pela posição da câmera) */
const ESC = b => b.wl === 'L' ? olho.x <= b.x1 : b.wl === 'R' ? olho.x >= b.x0 : b.wl === 'F' ? (cena.espelhada ? olho.z >= b.z0 : olho.z <= b.z1) : false;
const escondidas = fonte.filter(f => f.amb && ESC(f.b)).map(f => 'parede ' + f.b.wl);
const pecas = fonte.filter(f => !TEC(f.b) && !f.b.hid && !(f.amb && ESC(f.b)));

/* ---------- 2. geometria: caixa ou prisma, exatamente como veio ---------- */
function prisma(pts3, d) {                                   /* polígono (pontos 3D no mesmo plano) esticado pelo vetor d */
  const n = pts3.length, a = pts3[0], u = new THREE.Vector3().subVectors(new THREE.Vector3(...pts3[1]), new THREE.Vector3(...a)).normalize();
  const D = new THREE.Vector3(...d), nn = D.clone().normalize(), v = new THREE.Vector3().crossVectors(nn, u).normalize();
  const p2 = pts3.map(p => { const q = new THREE.Vector3(...p).sub(new THREE.Vector3(...a)); return new THREE.Vector2(q.dot(u), q.dot(v)); });
  const tri = THREE.ShapeUtils.triangulateShape(p2, []), pos = [];
  const P = (i, top) => { const p = pts3[i]; return top ? [p[0] + d[0], p[1] + d[1], p[2] + d[2]] : p; };
  tri.forEach(t => { pos.push(...P(t[0], 0), ...P(t[1], 0), ...P(t[2], 0)); pos.push(...P(t[0], 1), ...P(t[2], 1), ...P(t[1], 1)); });
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; pos.push(...P(i, 0), ...P(j, 0), ...P(j, 1), ...P(i, 0), ...P(j, 1), ...P(i, 1)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
}
function geo(b) {
  if (b.gp) return prisma(b.gp.a, b.gp.d);
  if (b.poly) return prisma(b.poly.map(q => [b.x0, q[1], q[0]]), [b.x1 - b.x0, 0, 0]);
  if (b.pf && b.pf.ax === 'x') return prisma(b.pf.pts.map(q => [b.x0, q[1], q[0]]), [b.x1 - b.x0, 0, 0]);
  if (b.pf && b.pf.ax === 'y') return prisma(b.pf.pts.map(q => [q[0], b.y0, q[1]]), [0, b.y1 - b.y0, 0]);
  if (b.pf && b.pf.ax === 'z') return prisma(b.pf.pts.map(q => [q[0], q[1], b.z0]), [0, 0, b.z1 - b.z0]);
  const g = new THREE.BoxGeometry(Math.max(b.x1 - b.x0, .01), Math.max(b.y1 - b.y0, .01), Math.max(b.z1 - b.z0, .01));
  g.translate((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, (b.z0 + b.z1) / 2); return g;
}

/* ---------- 3. material: a cor é a da peça; só muda como ela responde à luz ---------- */
const MATS = new Map();
function mat(b, amb) {
  const caixa = !(b.gp || b.pf || b.poly), c = b.c || [200, 200, 200], al = b.a === undefined ? 1 : b.a, em = b.em ? 1 : 0, k = c.join() + '|' + al + '|' + em + '|' + (amb ? 1 : 0) + '|' + (b.g || '') + '|' + caixa;
  if (MATS.has(k)) return MATS.get(k);
  const col = new THREE.Color().setRGB(c[0] / 255, c[1] / 255, c[2] / 255, THREE.SRGBColorSpace), lum = (c[0] * .3 + c[1] * .59 + c[2] * .11) / 255;
  let m;
  if (al < .98) m = new THREE.MeshPhysicalMaterial({ color: col, roughness: .06, metalness: 0, transparent: true, opacity: Math.max(.18, al), side: THREE.DoubleSide, depthWrite: false });
  else if (em) m = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 1.6, roughness: .6, side: THREE.DoubleSide });
  else m = new THREE.MeshStandardMaterial({ color: col, roughness: amb ? .92 : (b.g === 'stc' ? .28 : (lum < .28 ? .38 : .58)), metalness: 0, side: THREE.DoubleSide });
  /* na conta da sombra a caixa entra pela face de trás: a face iluminada não faz sombra nela mesma (sem risco listrado) */
  m.shadowSide = caixa ? THREE.BackSide : THREE.DoubleSide;
  MATS.set(k, m); return m;
}

/* ---------- 4. cena do render: um objeto por peça ---------- */
const W = Math.round(cena.tela.w * K), H = Math.round(cena.tela.h * K), cv = document.getElementById('aq');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H, false); cv.style.width = cena.tela.w + 'px'; cv.style.height = cena.tela.h + 'px';
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = .82;
R.shadowMap.enabled = MODO !== 'rapido'; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c2129);
const pm = new THREE.PMREMGenerator(R); scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .32;
const box = new THREE.Box3(), meshes = [];
pecas.forEach(f => {
  const m = new THREE.Mesh(geo(f.b), mat(f.b, f.amb)); m.userData.id = f.id; m.matrixAutoUpdate = false;
  const vidro = (f.b.a !== undefined && f.b.a < .98);
  const fino = Math.min(f.b.x1 - f.b.x0, f.b.y1 - f.b.y0, f.b.z1 - f.b.z0) < 3;   /* fita de borda e ferragem miúda não fazem sombra própria */
  m.castShadow = !f.amb && !vidro && !f.b.em && !fino; m.receiveShadow = !vidro;
  scene.add(m); meshes.push(m); if (!f.amb) { m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox); }
});

/* ---------- 5. luz técnica (não é peça do projeto): fica numa lista à parte ---------- */
const tecnicas = [];
const ctr = box.getCenter(new THREE.Vector3()), tam = box.getSize(new THREE.Vector3()), raio = Math.max(tam.x, tam.y, tam.z, 1000);
const hemi = new THREE.HemisphereLight(0xffffff, 0xb8ad9c, .42); scene.add(hemi); tecnicas.push('luz de preenchimento (céu/chão)');
const sol = new THREE.DirectionalLight(0xfff0d8, 3.4); sol.position.set(ctr.x + (olho.x < ctr.x ? -1 : 1) * raio * .9, ctr.y + raio * 1.35, ctr.z + (cena.espelhada ? -1 : 1) * raio * 1.1); sol.target.position.copy(ctr); scene.add(sol, sol.target);
sol.castShadow = MODO !== 'rapido'; sol.shadow.mapSize.set(4096, 4096); sol.shadow.bias = -.0006; sol.shadow.normalBias = 4; sol.shadow.radius = 4;
Object.assign(sol.shadow.camera, { left: -raio * .95, right: raio * .95, top: raio * .95, bottom: -raio * .95, near: raio * .4, far: raio * 4 }); sol.shadow.camera.updateProjectionMatrix();
tecnicas.push('luz principal com sombra suave');

/* ---------- 6. câmera: a MESMA da tela do 3D do editor (mesmas linhas da projeção) ---------- */
let wmin = 1e18, wmax = -1e18; const cor = new THREE.Vector3();
new THREE.Box3().setFromObject(scene).getSize(cor); const bb = new THREE.Box3().setFromObject(scene);
for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) { const w = Wr[0] * x + Wr[1] * y + Wr[2] * z + Wr[3]; wmin = Math.min(wmin, w); wmax = Math.max(wmax, w); }
const nr = Math.max(20, wmin * .5), fr = Math.max(nr * 10, wmax * 1.3), Az = (fr + nr) / (fr - nr), Bz = 2 * fr * nr / (fr - nr), Z = [Az * Wr[0], Az * Wr[1], Az * Wr[2], Az * Wr[3] - Bz];
const linha = r => [r[0], r[1], r[2], r[0] * olho.x + r[1] * olho.y + r[2] * olho.z + r[3]];
const cam = new THREE.Camera(); cam.position.copy(olho); cam.updateMatrixWorld(true);
cam.projectionMatrix.set(...linha(X), ...linha(Y), ...linha(Z), ...linha(Wr)); cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();

/* ---------- 7. conferência (depois): cada peça da cópia tem que estar no render, no mesmo lugar e do mesmo tamanho ---------- */
/* a medida de cada peça é a do desenho do editor: caixa pelas 6 faces; prisma pelo contorno dele mais o comprimento */
const mm = (P, i) => [Math.min(...P.map(p => p[i])), Math.max(...P.map(p => p[i]))];
const lim = b => {
  if (b.gp) { const P = b.gp.a.concat(b.gp.a.map(p => [p[0] + b.gp.d[0], p[1] + b.gp.d[1], p[2] + b.gp.d[2]])); return [mm(P, 0), mm(P, 1), mm(P, 2)]; }
  if (b.poly) return [[b.x0, b.x1], mm(b.poly, 1), mm(b.poly, 0)];
  if (b.pf && b.pf.ax === 'x') return [[b.x0, b.x1], mm(b.pf.pts, 1), mm(b.pf.pts, 0)];
  if (b.pf && b.pf.ax === 'y') return [mm(b.pf.pts, 0), [b.y0, b.y1], mm(b.pf.pts, 1)];
  if (b.pf && b.pf.ax === 'z') return [mm(b.pf.pts, 0), mm(b.pf.pts, 1), [b.z0, b.z1]];
  return [[b.x0, b.x1], [b.y0, b.y1], [b.z0, b.z1]];
};
const porId = new Map(meshes.map(m => [m.userData.id, m])), div = [];
pecas.forEach(f => {
  const m = porId.get(f.id); if (!m) { div.push(f.id + ' faltando'); return; }
  m.geometry.computeBoundingBox(); const g = m.geometry.boundingBox, L = lim(f.b), G = [[g.min.x, g.max.x], [g.min.y, g.max.y], [g.min.z, g.max.z]];
  for (let i = 0; i < 3; i++) if (Math.abs(G[i][0] - Math.min(...L[i])) > .6 || Math.abs(G[i][1] - Math.max(...L[i])) > .6) { div.push(f.id + ' fora da medida (' + (f.b.nm || f.b.g || '') + ')'); break; }
});
const extras = meshes.length - pecas.length;
const ok = div.length === 0 && extras === 0;

/* ---------- 8. render ---------- */
const t1 = performance.now();
if (ok) { R.render(scene, cam); R.getContext().finish(); }
const t2 = performance.now();
const gl = R.getContext();
window.aqRelatorio = {
  modo: MODO, imagem: [W, H], espelhadaNaProfundidade: cena.espelhada, pecasNaCopia: pecas.length, objetosNoRender: meshes.length, truquesDoEditorForaDaConta: fonte.length - pecas.length,
  divergencias: div.slice(0, 30), liberado: ok, luzesTecnicas: tecnicas, escondidasPelaCameraIgualAo3D: escondidas,
  tempoMontarMs: Math.round(t1 - t0), tempoRenderMs: Math.round(t2 - t1), materiais: MATS.size,
  aparelho: { webgl2: !!R.capabilities.isWebGL2, maxTextura: R.capabilities.maxTextureSize, maxImagem: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), texturaFloat: !!gl.getExtension('EXT_color_buffer_float'), placa: (() => { try { const e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : ''; } catch (_) { return ''; } })() }
};
document.getElementById('inf').textContent = ok ? 'AQRender (prova): ' + pecas.length + ' peças conferidas · ' + Math.round(t2 - t0) + ' ms' : 'BLOQUEADO: a cena do render não bate com o 3D\n' + div.slice(0, 12).join('\n');
window.aqPronto = true;
</script>
</body>
</html>
